<svg viewBox="0 0 700 220" role="img" aria-label="今日やること: summaryの一覧で列がガタガタになる。padEndは文字数で埋めるが、日本語は画面上で半角の2文字分の幅を占めるため、同じpadEnd12でも見た目の幅が揃わない。表示幅を数えて直す。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 9.5px; text-anchor: start; }
  .code { fill: #e7ece9; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; text-anchor: start; }
  .code-mark { fill: #e0bc7c; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; text-anchor: start; }
  .ruler { stroke: #4a524e; stroke-width: 1; }
  .ruler-text { fill: #6b746d; font-family: ui-monospace, Consolas, monospace; font-size: 8px; text-anchor: middle; }
  .legend-t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 700; text-anchor: start; }
  .legend-s { fill: #6b746d; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .legend-t { fill: #e7ece9; }
    .legend-s { fill: #a9b3ac; }
    .foot { fill: #a9b3ac; }
  }
</style>

<rect class="bg" x="0" y="0" width="700" height="220"/>

<!-- code mockup: ragged columns -->
<rect class="win" x="20" y="20" width="330" height="120" rx="6"/>
<text class="win-title" x="32" y="38">$ node src/main.ts summary</text>

<text class="code" x="32" y="64">u1001  田中ゆき  投稿 3件</text>
<text class="code" x="32" y="86">u1002  佐藤けん  投稿 3件</text>
<text class="code" x="32" y="108">u1003  <tspan class="code-mark">(名前未設定)</tspan>  投稿 2件</text>

<!-- ruler showing misalignment -->
<line class="ruler" x1="152" y1="52" x2="152" y2="120"/>
<text class="ruler-text" x="152" y="132">揃うはずの位置</text>

<!-- legend -->
<g>
  <text class="legend-t" x="380" y="46">"田中ゆき".length → 4</text>
  <text class="legend-s" x="380" y="64">画面の幅は半角8文字ぶん</text>
</g>
<g>
  <text class="legend-t" x="380" y="96">"(名前未設定)".length → 7</text>
  <text class="legend-s" x="380" y="114">画面の幅は半角11文字ぶん</text>
</g>

<text class="foot" x="350" y="180">padEnd(12) は「12文字になるまで埋める」。文字数と、画面上の幅は別物</text>

</svg>
