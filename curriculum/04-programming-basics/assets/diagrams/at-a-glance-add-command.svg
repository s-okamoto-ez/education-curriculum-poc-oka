<svg viewBox="0 0 700 220" role="img" aria-label="今日やること: 今月から始めた利用者を一覧するnew-usersコマンドを足す。現在の日時を基準にすると、データが全部2025年で今は2026年8月のため常に該当なしになる。年月を引数で指定する形に作り直す。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .win-warn { stroke: #a8792f; }
  .win-ok { stroke: #1f6f66; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 9.5px; text-anchor: start; }
  .code { fill: #e7ece9; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; text-anchor: start; }
  .code-warn { fill: #e0bc7c; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; text-anchor: start; }
  .code-ok { fill: #86d6cb; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; text-anchor: start; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .t { fill: #e7ece9; }
    .foot { fill: #a9b3ac; }
  }
</style>

<rect class="bg" x="0" y="0" width="700" height="220"/>

<!-- left: naive "this month" -->
<text class="t" x="170" y="24">「今月」を現在日時から求める</text>
<rect class="win win-warn" x="30" y="34" width="280" height="110" rx="6"/>
<text class="win-title" x="42" y="52">$ node src/main.ts new-users</text>
<text class="code" x="42" y="76">今日: 2026-08-25</text>
<text class="code" x="42" y="94">データ: 2025-04〜2025-09</text>
<text class="code-warn" x="42" y="118">(該当なし)</text>

<!-- right: explicit year-month -->
<text class="t" x="530" y="24">年月を引数で指定する</text>
<rect class="win win-ok" x="390" y="34" width="280" height="110" rx="6"/>
<text class="win-title" x="402" y="52">$ node src/main.ts new-users 2025-06</text>
<text class="code" x="402" y="76">2025-06 に参加した利用者</text>
<text class="code-ok" x="402" y="98">u1004  鈴木あや</text>
<text class="code-ok" x="402" y="114">u1005  高橋りく</text>

<text class="foot" x="350" y="180">「現在の日時」を基準にすると、実行するたびに結果が変わる。予測してから実行する、ができなくなる</text>

</svg>
