<text x="52" y="158"><tspan class="e-at">    at </tspan><tspan class="e-mine">renderTimeline (src/timeline.ts:52:9)</tspan></text>
<text x="52" y="182"><tspan class="e-at">    at </tspan><tspan class="e-lib">Array.map (&lt;anonymous&gt;)</tspan></text>
<text x="52" y="206"><tspan class="e-at">    at </tspan><tspan class="e-lib">node_modules/react-dom/cjs/react-dom.js:9021:14</tspan></text>
<text x="52" y="230"><tspan class="e-at">    at </tspan><tspan class="e-lib">node_modules/react-dom/cjs/react-dom.js:8734:22</tspan></text>

<!-- highlight box on first stack line -->
<rect class="hl" x="46" y="94" width="590" height="24" rx="4"/>

<!-- direction indicator -->
<line class="dir-line" x1="668" y1="188" x2="668" y2="106" marker-end="url(#eaArrow)"/>
<text class="dir" x="682" y="122">呼び出し元へ</text>
<text class="dir" x="682" y="140">遡っていく向き</text>
<text class="dir" x="682" y="184">(下ほど古い)</text>

<!-- cards -->
<g>
  <circle class="n-bg" cx="42" cy="286" r="11"/>
  <text class="n" x="42" y="290">1</text>
  <rect class="card-key" x="62" y="266" width="440" height="70" rx="10"/>
  <text class="k-title" x="82" y="292">1行目 — 何が起きたか</text>
  <text class="k-body" x="82" y="316">「undefined の name を読もうとした」。原因ではなく症状です</text>
</g>

<g>
  <circle class="n-bg" cx="42" cy="374" r="11"/>
  <text class="n" x="42" y="378">2</text>
  <rect class="card-key" x="62" y="354" width="440" height="70" rx="10"/>
  <text class="k-title" x="82" y="380">2行目 — どこで起きたか</text>
  <text class="k-body" x="82" y="404">src/post.ts の14行目22文字目。ここを最初に開きます</text>
</g>

<g>
  <circle class="n-bg" cx="542" cy="286" r="11"/>
  <text class="n" x="542" y="290">3</text>
  <rect class="card" x="562" y="266" width="410" height="70" rx="10"/>
  <text class="k-title" x="582" y="292">3行目以降 — どうやってそこに来たか</text>
  <text class="k-body" x="582" y="316">renderTimeline → renderPost → formatAuthor の順に呼ばれた</text>
