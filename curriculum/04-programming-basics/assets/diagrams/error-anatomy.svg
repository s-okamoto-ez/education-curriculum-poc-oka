<g>
  <circle class="n-bg" cx="542" cy="374" r="11"/>
  <text class="n" x="542" y="378">4</text>
  <rect class="card" x="562" y="354" width="410" height="70" rx="10"/>
  <text class="k-title" x="582" y="380">node_modules の行は、いったん飛ばす</text>
  <text class="k-body" x="582" y="404">他人のコードです。まず自分のファイル名を上から探す</text>
</g>

<text class="foot" x="500" y="440"> </text>

</svg>
