<rect class="term" x="30" y="48" width="620" height="200" rx="8"/>
<text x="52" y="78"><tspan class="e-type">TypeError</tspan><tspan class="e-msg">: Cannot read properties of undefined (reading 'name')</tspan></text>
<text x="52" y="110"><tspan class="e-at">    at </tspan><tspan class="e-mine">formatAuthor (src/post.ts:14:22)</tspan></text>
