<svg viewBox="0 0 700 220" role="img" aria-label="今日やること: main.tsを入口として5つのファイルの呼び出し関係を読み解く。main.tsがload.ts・format.ts・report.tsを呼び、report.tsはさらにformat.tsを呼んでいる。この地図を自分で書き出す。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .win-entry { stroke: #1f6f66; stroke-width: 2; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
  .win-title-entry { fill: #86d6cb; }
  .arrow { stroke: #8d968f; stroke-width: 2; fill: none; }
  .arrow-dim { stroke: #b9c0bb; stroke-width: 1.5; fill: none; stroke-dasharray: 3 3; }
  .badge-entry { fill: #1f6f66; }
  .badge-text { fill: #ffffff; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .t { fill: #e7ece9; }
    .foot { fill: #a9b3ac; }
    .arrow { stroke: #6b746d; }
    .arrow-dim { stroke: #4a524e; }
  }
</style>

<rect class="bg" x="0" y="0" width="700" height="220"/>

<defs>
  <marker id="atArrowMap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <polygon points="0,0 10,5 0,10" fill="#8d968f"/>
  </marker>
</defs>

<!-- entry point -->
<rect class="win win-entry" x="290" y="20" width="120" height="46" rx="6"/>
<text class="win-title win-title-entry" x="350" y="48">main.ts</text>
<circle class="badge-entry" cx="290" cy="20" r="11"/>
<text class="badge-text" x="290" y="24">入口</text>

<!-- three callees -->
<rect class="win" x="60" y="120" width="130" height="46" rx="6"/>
<text class="win-title" x="125" y="148">load.ts</text>

<rect class="win" x="285" y="120" width="130" height="46" rx="6"/>
<text class="win-title" x="350" y="148">report.ts</text>

<rect class="win" x="510" y="120" width="130" height="46" rx="6"/>
<text class="win-title" x="575" y="148">format.ts</text>

<!-- arrows from main.ts -->
<path class="arrow" d="M 300 66 C 250 90, 180 100, 130 120" marker-end="url(#atArrowMap)"/>
<line class="arrow" x1="350" y1="66" x2="350" y2="120" marker-end="url(#atArrowMap)"/>
<path class="arrow" d="M 400 66 C 460 90, 540 100, 580 120" marker-end="url(#atArrowMap)"/>

<!-- report.ts -> format.ts -->
<path class="arrow-dim" d="M 415 143 C 470 155, 500 155, 510 148" marker-end="url(#atArrowMap)"/>

<!-- types.ts referenced by all -->
<rect class="win" x="285" y="190" width="130" height="0" rx="6" opacity="0"/>

<text class="t" x="350" y="100">main.ts が3つのファイルを呼ぶ</text>

<text class="foot" x="350" y="195">report.ts は format.ts の displayNameOf も呼んでいる。矢印を自分でたどって、この地図を描き出す</text>

</svg>
