<svg viewBox="0 0 900 220" role="img" aria-label="今日やること: expectedフォルダに3コマンドの出力を保存し、check.shで今の出力と比べる仕組みを自分で作る。何も壊していなければ全部一致し、topの件数をわざと変えて壊すとcheck.shが差分を検出する。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .num-bg-1 { fill: #8d968f; }
  .num-bg-2 { fill: #1f6f66; }
  .num-bg-3 { fill: #a35555; }
  .num { fill: #ffffff; font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .win-1 { stroke: #4a524e; }
  .win-2 { stroke: #1f6f66; }
  .win-3 { stroke: #a35555; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 9.5px; text-anchor: start; }
  .code { fill: #e7ece9; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .code-ok { fill: #86d6cb; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .code-err { fill: #e29a9a; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .arrow { stroke: #8d968f; stroke-width: 2; fill: none; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .t { fill: #e7ece9; }
    .foot { fill: #a9b3ac; }
    .arrow { stroke: #6b746d; }
  }
</style>

<rect class="bg" x="0" y="0" width="900" height="220"/>

<defs>
  <marker id="atArrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <polygon points="0,0 10,5 0,10" fill="#8d968f"/>
  </marker>
</defs>

<!-- step 1: save expected -->
<circle class="num-bg-1" cx="150" cy="24" r="12"/><text class="num" x="150" y="29">1</text>
<text class="t" x="150" y="48">今の出力を保存する</text>
<rect class="win win-1" x="20" y="58" width="260" height="90" rx="6"/>
<text class="win-title" x="32" y="76">$ node main.ts summary \</text>
<text class="win-title" x="32" y="90">  &gt; expected/summary.txt</text>
<text class="code" x="32" y="116">expected/summary.txt</text>
<text class="code" x="32" y="132">expected/top.txt ...</text>

<line class="arrow" x1="284" y1="103" x2="316" y2="103" marker-end="url(#atArrowP)"/>

<!-- step 2: check.sh matches -->
<circle class="num-bg-2" cx="450" cy="24" r="12"/><text class="num" x="450" y="29">2</text>
<text class="t" x="450" y="48">check.sh で比べる</text>
<rect class="win win-2" x="320" y="58" width="260" height="90" rx="6"/>
<text class="win-title" x="332" y="76">$ bash check.sh</text>
<text class="code-ok" x="332" y="98">OK   summary</text>
<text class="code-ok" x="332" y="114">OK   top</text>
<text class="code-ok" x="332" y="130">OK   suspended</text>

<line class="arrow" x1="584" y1="103" x2="616" y2="103" marker-end="url(#atArrowP)"/>

<!-- step 3: break it, detect -->
<circle class="num-bg-3" cx="750" cy="24" r="12"/><text class="num" x="750" y="29">3</text>
<text class="t" x="750" y="48">わざと壊すと検出する</text>
<rect class="win win-3" x="620" y="58" width="260" height="90" rx="6"/>
<text class="win-title" x="632" y="76">topPosts(posts, 3) に変更</text>
<text class="code-err" x="632" y="98">NG   top  (差分あり)</text>
<text class="code-err" x="632" y="114">9件が消えている</text>

<text class="foot" x="450" y="180">「あるべき姿」を先に保存し、機械的に比べる。これがテストの最も基本的な原理</text>

</svg>
