<svg viewBox="0 0 900 220" role="img" aria-label="今日やること: 05-async.tsの3つのパートを順に試し、成功する場合、try catchで受け止めて失敗する場合、try catchが無いまま失敗してプログラムごと落ちる場合の3つの結果を自分の目で確かめる。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .num-bg-1 { fill: #1f6f66; }
  .num-bg-2 { fill: #a8792f; }
  .num-bg-3 { fill: #a35555; }
  .num { fill: #ffffff; font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .win-1 { stroke: #1f6f66; }
  .win-2 { stroke: #a8792f; }
  .win-3 { stroke: #a35555; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 9.5px; text-anchor: start; }
  .code-ok { fill: #86d6cb; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .code-warn { fill: #e0bc7c; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .code-err { fill: #e29a9a; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .t { fill: #e7ece9; }
    .foot { fill: #a9b3ac; }
  }
</style>

<rect class="bg" x="0" y="0" width="900" height="220"/>

<!-- part 1: success -->
<circle class="num-bg-1" cx="150" cy="24" r="12"/><text class="num" x="150" y="29">1</text>
<text class="t" x="150" y="48">成功する場合</text>
<rect class="win win-1" x="20" y="58" width="260" height="90" rx="6"/>
<text class="win-title" x="32" y="76">loadSuccess()</text>
<text class="code-ok" x="32" y="98">[パート1] 読み込み中...</text>
<text class="code-ok" x="32" y="116">[パート1] 取得できた投稿数: 2</text>
<text class="code-ok" x="32" y="134">正常に終わる</text>

<!-- part 2: caught -->
<circle class="num-bg-2" cx="450" cy="24" r="12"/><text class="num" x="450" y="29">2</text>
<text class="t" x="450" y="48">失敗するが受け止める</text>
<rect class="win win-2" x="320" y="58" width="260" height="90" rx="6"/>
<text class="win-title" x="332" y="76">loadWithTryCatch()</text>
<text class="code-warn" x="332" y="98">[パート2] 失敗しました: ...</text>
<text class="code-warn" x="332" y="116">[パート2] ここは必ず実行される</text>
<text class="code-ok" x="332" y="134">正常に終わる(try/catch)</text>

<!-- part 3: uncaught crash -->
<circle class="num-bg-3" cx="750" cy="24" r="12"/><text class="num" x="750" y="29">3</text>
<text class="t" x="750" y="48">受け止めずに落ちる</text>
<rect class="win win-3" x="620" y="58" width="260" height="90" rx="6"/>
<text class="win-title" x="632" y="76">loadWithoutTryCatch()</text>
<text class="code-err" x="632" y="98">[パート3] 読み込み中...</text>
<text class="code-err" x="632" y="116">Uncaught (in promise) Error</text>
<text class="code-err" x="632" y="134">終了コードが 0 以外になる</text>

<text class="foot" x="450" y="180">コード上の違いは try / catch があるかないかだけ。それだけで、プログラムが生き残るか落ちるかが変わる</text>

</svg>
