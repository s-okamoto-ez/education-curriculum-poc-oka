<svg viewBox="0 0 700 220" role="img" aria-label="今日やること: price + countFromApiとprice * countFromApiという似た2行のコードが、文字列連結と数値の掛け算というまったく違う結果になることを予測してから確かめる。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 9.5px; text-anchor: start; }
  .code { fill: #e7ece9; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; text-anchor: start; }
  .code-dim { fill: #6b746d; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; text-anchor: start; }
  .badge-1 { fill: #a8792f; }
  .badge-2 { fill: #1f6f66; }
  .badge-text { fill: #ffffff; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .legend-t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 700; text-anchor: start; }
  .legend-s { fill: #6b746d; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; text-anchor: start; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .legend-t { fill: #e7ece9; }
    .legend-s { fill: #a9b3ac; }
    .foot { fill: #a9b3ac; }
  }
</style>

<rect class="bg" x="0" y="0" width="700" height="220"/>

<!-- code mockup: 01-predict.ts part 4 -->
<rect class="win" x="20" y="20" width="300" height="130" rx="6"/>
<text class="win-title" x="32" y="38">01-predict.ts — パート4</text>
<text class="code-dim" x="32" y="60">const price = 1200;</text>
<text class="code-dim" x="32" y="78">const countFromApi = "3";</text>
<text class="code" x="32" y="102">price + countFromApi</text>
<text class="code" x="32" y="130">price * countFromApi</text>

<!-- badges on the mockup -->
<circle class="badge-1" cx="300" cy="97" r="12"/>
<text class="badge-text" x="300" y="102">1</text>
<circle class="badge-2" cx="300" cy="125" r="12"/>
<text class="badge-text" x="300" y="130">2</text>

<!-- legend -->
<g>
  <circle class="badge-1" cx="356" cy="52" r="12"/>
  <text class="badge-text" x="356" y="57">1</text>
  <text class="legend-t" x="378" y="48">price + countFromApi</text>
  <text class="legend-s" x="378" y="64">→ "12003"(文字列としてつながる)</text>
</g>

<g>
  <circle class="badge-2" cx="356" cy="102" r="12"/>
  <text class="badge-text" x="356" y="107">2</text>
  <text class="legend-t" x="378" y="98">price * countFromApi</text>
  <text class="legend-s" x="378" y="114">→ 3600(数値に変換されて計算)</text>
</g>

<text class="foot" x="350" y="180">同じ countFromApi なのに、+ と * で結果の"性質"が変わる。先に予測してから確かめる</text>

</svg>
