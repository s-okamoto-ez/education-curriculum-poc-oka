<svg viewBox="0 0 900 220" role="img" aria-label="今日やること: main.tsからtimeline.ts、post.tsへと呼び出しが連鎖し、findUserがu9021のユーザー情報を見つけられずundefinedを返し、その先でTypeErrorが起きる。スタックトレースを頼りに、どの呼び出しの連鎖のどこで壊れたかを特定する。" xmlns="http://www.w3.org/2000/svg">
