<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>つながるノート — コメントを投稿</title>
  <link rel="stylesheet" href="comment-form.css">
</head>
<body>

  <header class="site-header">
    <p class="logo">つながるノート</p>
  </header>

  <main class="form-container">

    <h1>コメントを投稿する</h1>
    <p class="lead">「メンテナンスのお知らせ」へのコメントです。</p>

    <form class="comment-form">

      <div class="field">
        <label for="name">お名前</label>
        <input type="text" id="name" name="name" placeholder="例: 田中太郎" required>
      </div>

      <div class="field">
        <label>メールアドレス</label>
        <input type="email" id="email" name="email" placeholder="例: taro@example.com" required>
      </div>

      <div class="field">
        <label for="comment">コメント</label>
        <textarea id="comment" name="comment" rows="5" maxlength="200" placeholder="ご意見・ご質問はこちらに"></textarea>
      </div>

      <div class="field field-checkbox">
        <input type="checkbox" id="agree" name="agree">
        <label for="agree">投稿ガイドラインに同意します</label>
      </div>

      <div class="submit-button">投稿する</div>

    </form>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 つながるノート</p>
  </footer>

</body>
</html>
