<svg viewBox="0 0 900 230" role="img" aria-label="今日やること: 開発者ツールの3つのパネルを読む。ElementsでDOM構造を開き、Stylesで打ち消し線が引かれた負けたルールを探し、Computedで.cardと.containerの実測幅を見比べる。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .row { fill: #d7dcd8; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; }
  .row-dim { fill: #6b746d; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; }
  .row-strike { fill: #8d968f; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; text-decoration: line-through; }
  .row-win { fill: #86d6cb; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; }
  .q { fill: #e0bc7c; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; font-weight: 700; text-anchor: start; }
  .num-bg { fill: #1f6f66; }
  .num { fill: #ffffff; font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .t { fill: #e7ece9; }
    .foot { fill: #a9b3ac; }
  }
</style>

<rect class="bg" x="0" y="0" width="900" height="230"/>

<!-- panel 1: Elements -->
<circle class="num-bg" cx="150" cy="24" r="12"/><text class="num" x="150" y="29">1</text>
<text class="t" x="150" y="48">Elements で構造を開く</text>
<rect class="win" x="20" y="58" width="260" height="120" rx="6"/>
<text class="win-title" x="34" y="76">html</text>
<text class="row" x="50" y="94">body</text>
<text class="row" x="66" y="112">.site-header</text>
<text class="row" x="66" y="130">main</text>
<text class="row-win" x="82" y="148">.card ×3?</text>

<!-- panel 2: Styles -->
<circle class="num-bg" cx="450" cy="24" r="12"/><text class="num" x="450" y="29">2</text>
<text class="t" x="450" y="48">Styles で負けたルールを探す</text>
<rect class="win" x="320" y="58" width="260" height="120" rx="6"/>
<text class="win-title" x="334" y="76">h1 に当たっているCSS</text>
<text class="row-strike" x="334" y="98">.notice { color }</text>
<text class="row-win" x="334" y="118">#page-title { color }</text>
<text class="q" x="334" y="148">← どちらが勝つ?</text>

<!-- panel 3: Computed -->
<circle class="num-bg" cx="750" cy="24" r="12"/><text class="num" x="750" y="29">3</text>
<text class="t" x="750" y="48">Computed で実測値を比べる</text>
<rect class="win" x="620" y="58" width="260" height="120" rx="6"/>
<text class="row-dim" x="634" y="82">.card の幅</text>
<text class="q" x="634" y="102">? px</text>
<text class="row-dim" x="634" y="132">.container の幅</text>
<text class="q" x="634" y="152">? px</text>

<text class="foot" x="450" y="210">3つのパネルを見比べて、「.cardのほうが広い」という次の演習の題材に気づく</text>

</svg>
