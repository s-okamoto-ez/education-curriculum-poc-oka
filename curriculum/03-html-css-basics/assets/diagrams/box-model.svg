<svg viewBox="0 0 980 420" role="img" aria-label="CSSのボックスモデルの図。中心に content があり、その外側を padding、border、margin が順に囲んでいる。padding は枠の内側の余白、border は枠線そのもの、margin は枠の外側の余白であることを、贈り物の箱に例えて示している。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .margin-box { fill: #fbe6c8; stroke: #e0b072; stroke-width: 1.4; stroke-dasharray: 5 4; }
  .border-box { fill: #cfd8d2; stroke: #93a099; stroke-width: 1.4; }
  .padding-box { fill: #cfe8e2; stroke: #7fc0b3; stroke-width: 1.4; }
  .content-box { fill: #ffffff; stroke: #1f6f66; stroke-width: 2; }
  .lbl { fill: #465049; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12.5px; font-weight: 700; }
  .content-lbl { fill: #164f48; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 14px; font-weight: 700; text-anchor: middle; }
  .content-sub { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  .card { fill: #ffffff; stroke: #d7dcd8; stroke-width: 1.4; }
  .row-name { fill: #15191a; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13.5px; font-weight: 700; }
  .row-body { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12.5px; }
  .panel-title { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 14px; font-weight: 700; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 13px; text-anchor: middle; }
  .chip-m { fill: #e0b072; }
  .chip-b { fill: #93a099; }
  .chip-p { fill: #7fc0b3; }
  .chip-c { fill: #1f6f66; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .margin-box { fill: #3a2f1e; stroke: #8a6a34; }
    .border-box { fill: #2a302e; stroke: #59635f; }
    .padding-box { fill: #1c3b37; stroke: #3f8478; }
    .content-box { fill: #1a1f1d; stroke: #5fc0b3; }
    .lbl { fill: #a9b3ac; }
    .content-lbl { fill: #86d6cb; }
    .content-sub { fill: #a9b3ac; }
    .card { fill: #1a1f1d; stroke: #2b3230; }
    .row-name { fill: #e7ece9; }
    .row-body { fill: #a9b3ac; }
    .panel-title { fill: #e7ece9; }
    .foot { fill: #a9b3ac; }
    .chip-m { fill: #8a6a34; }
    .chip-b { fill: #59635f; }
    .chip-p { fill: #3f8478; }
    .chip-c { fill: #5fc0b3; }
  }
</style>

<rect class="bg" x="0" y="0" width="980" height="420"/>

<!-- nested boxes -->
<g>
  <rect class="margin-box" x="40" y="40" width="420" height="290" rx="6"/>
  <text class="lbl" x="54" y="62">margin</text>

  <rect class="border-box" x="90" y="88" width="320" height="194" rx="4"/>
  <text class="lbl" x="104" y="110">border</text>

  <rect class="padding-box" x="132" y="132" width="236" height="106" rx="3"/>
  <text class="lbl" x="146" y="152">padding</text>

  <rect class="content-box" x="176" y="166" width="148" height="40" rx="3"/>
  <text class="content-lbl" x="250" y="184">content</text>
  <text class="content-sub" x="250" y="200">文字や画像そのもの</text>
</g>

<!-- legend -->
<g>
  <rect class="card" x="510" y="40" width="440" height="290" rx="10"/>
  <text class="panel-title" x="536" y="70">内側から外側へ、4つの層</text>

  <rect class="chip-c" x="536" y="90" width="14" height="14" rx="3"/>
  <text class="row-name" x="562" y="102">content</text>
  <text class="row-body" x="562" y="122">中身そのもの。文字や画像</text>

  <rect class="chip-p" x="536" y="146" width="14" height="14" rx="3"/>
  <text class="row-name" x="562" y="158">padding</text>
  <text class="row-body" x="562" y="178">枠の「内側」の余白。背景色はここまで塗られる</text>

  <rect class="chip-b" x="536" y="202" width="14" height="14" rx="3"/>
  <text class="row-name" x="562" y="214">border</text>
  <text class="row-body" x="562" y="234">枠線そのもの。太さも幅として場所を取る</text>

  <rect class="chip-m" x="536" y="258" width="14" height="14" rx="3"/>
  <text class="row-name" x="562" y="270">margin</text>
  <text class="row-body" x="562" y="290">枠の「外側」の余白。隣の要素との距離</text>
</g>

<text class="foot" x="490" y="372">贈り物にたとえると、content が品物、padding が緩衝材、border が箱、margin が箱と箱の間の隙間です。</text>
<text class="foot" x="490" y="398">「思ったより大きい」の原因はたいてい padding と border。「思ったより離れている」の原因はたいてい margin。</text>

</svg>
