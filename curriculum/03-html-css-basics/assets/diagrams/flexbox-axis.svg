<svg viewBox="0 0 1000 380" role="img" aria-label="display: flex を当てた要素が、子要素を横方向(主軸)に並べる図。並べ方の指定はjustify-contentが主軸方向の間隔を、align-itemsが交差軸(縦方向)の位置をそれぞれ担当する。同じ子要素でもflexを外すと縦に積み上がるだけの状態に戻ることを示している。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .box { fill: #ffffff; stroke: #d7dcd8; stroke-width: 1.4; }
  .box-accent { fill: #ffffff; stroke: #1f6f66; stroke-width: 2; }
  .child { fill: #d7e9e4; stroke: #1f6f66; stroke-width: 1.6; }
  .child-b { fill: #465049; font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .title { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 13.5px; font-weight: 700; }
  .body { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; }
  .code { fill: #164f48; font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 700; }
  .axis { stroke: #8a5fc0; stroke-width: 1.6; fill: none; }
  .axis-label { fill: #6a4590; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11px; font-weight: 700; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 13px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .box { fill: #1a1f1d; stroke: #2b3230; }
    .box-accent { fill: #1a1f1d; stroke: #5fc0b3; }
    .child { fill: #24403b; stroke: #5fc0b3; }
    .child-b { fill: #a9b3ac; }
    .title { fill: #e7ece9; }
    .body { fill: #a9b3ac; }
    .code { fill: #86d6cb; }
    .axis { stroke: #b090e0; }
    .axis-label { fill: #cdb0ea; }
    .foot { fill: #a9b3ac; }
  }
</style>

<rect class="bg" x="0" y="0" width="1000" height="380"/>

<!-- LEFT: without flex -->
<g>
  <rect class="box" x="30" y="24" width="420" height="300" rx="10"/>
  <text class="title" x="54" y="52">display: flex が無いとき</text>
  <text class="code" x="54" y="72">.stats { }</text>

  <rect class="child" x="54" y="88" width="372" height="60" rx="6"/>
  <text class="child-b" x="240" y="122">128 / 投稿</text>

  <rect class="child" x="54" y="156" width="372" height="60" rx="6"/>
  <text class="child-b" x="240" y="190">3,402 / フォロワー</text>

  <rect class="child" x="54" y="224" width="372" height="60" rx="6"/>
  <text class="child-b" x="240" y="258">89 / フォロー中</text>

  <text class="body" x="54" y="304">block要素は、上から下に積み上がるのが既定です</text>
</g>

<!-- RIGHT: with flex -->
<g>
  <rect class="box-accent" x="490" y="24" width="480" height="300" rx="10"/>
  <text class="title" x="514" y="52">display: flex を当てたとき</text>
  <text class="code" x="514" y="72">.stats { display: flex; }</text>

  <rect class="child" x="514" y="120" width="130" height="90" rx="6"/>
  <text class="child-b" x="579" y="160">128</text>
  <text class="child-b" x="579" y="178" font-weight="400">投稿</text>

  <rect class="child" x="660" y="120" width="130" height="90" rx="6"/>
  <text class="child-b" x="725" y="160">3,402</text>
  <text class="child-b" x="725" y="178" font-weight="400">フォロワー</text>

  <rect class="child" x="806" y="120" width="130" height="90" rx="6"/>
  <text class="child-b" x="871" y="160">89</text>
  <text class="child-b" x="871" y="178" font-weight="400">フォロー中</text>

  <!-- main axis arrow -->
  <line class="axis" x1="514" y1="98" x2="936" y2="98"/>
  <text class="axis-label" x="725" y="92" text-anchor="middle">主軸(横方向) — justify-content で間隔を決める</text>

  <!-- cross axis arrow -->
  <line class="axis" x1="960" y1="120" x2="960" y2="230"/>
  <text class="axis-label" x="965" y="176" text-anchor="start" transform="rotate(90 965 176)">交差軸</text>

  <text class="body" x="514" y="252">子要素が、横一列に並びます</text>
  <text class="body" x="514" y="270">縦方向の揃え方は align-items で決めます</text>
</g>

<text class="foot" x="500" y="356">「並べたい方向」に親要素へ display: flex を1つ書くだけで、子要素の並び方が変わります。</text>

</svg>
