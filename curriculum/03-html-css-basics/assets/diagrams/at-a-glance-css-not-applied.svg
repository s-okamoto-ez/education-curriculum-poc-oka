<svg viewBox="0 0 900 230" role="img" aria-label="今日やること: お知らせページの2箇所の依頼、①大見出しがnoticeクラスの緑にならない原因はより強いID指定、②一番下のカードの日付だけ薄い原因はHTMLに直接書かれたインラインstyle、をそれぞれ突き止めて直す。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .page { fill: #ffffff; stroke: #d7dcd8; stroke-width: 1.4; }
  .headline-wrong { fill: #6b746d; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 20px; font-weight: 700; text-anchor: start; }
  .card { fill: #f4f6f4; stroke: #d7dcd8; stroke-width: 1.2; }
  .card-bar { fill: #b7bdb8; }
  .date-ok { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 10px; text-anchor: start; }
  .date-wrong { fill: #c7cbc8; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 10px; text-anchor: start; }
  .badge-1 { fill: #a35555; }
  .badge-2 { fill: #a8792f; }
  .badge-text { fill: #ffffff; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .legend-t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 700; text-anchor: start; }
  .legend-s { fill: #6b746d; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .page { fill: #1a1f1d; stroke: #2b3230; }
    .headline-wrong { fill: #8d968f; }
    .card { fill: #171b1a; stroke: #2b3230; }
    .card-bar { fill: #4a524e; }
    .date-ok { fill: #a9b3ac; }
    .date-wrong { fill: #4a524e; }
    .legend-t { fill: #e7ece9; }
    .legend-s { fill: #a9b3ac; }
    .foot { fill: #a9b3ac; }
  }
</style>

<rect class="bg" x="0" y="0" width="900" height="230"/>

<!-- page mockup -->
<rect class="page" x="20" y="20" width="360" height="190" rx="8"/>

<text class="headline-wrong" x="40" y="56">お知らせ</text>
<circle class="badge-1" cx="200" cy="48" r="13"/><text class="badge-text" x="200" y="53">1</text>

<rect class="card" x="40" y="76" width="320" height="38" rx="6"/>
<rect class="card-bar" x="52" y="86" width="140" height="8" rx="2"/>
<text class="date-ok" x="52" y="106">2026年3月1日</text>

<rect class="card" x="40" y="122" width="320" height="38" rx="6"/>
<rect class="card-bar" x="52" y="132" width="140" height="8" rx="2"/>
<text class="date-ok" x="52" y="152">2026年2月18日</text>

<rect class="card" x="40" y="168" width="320" height="38" rx="6"/>
<rect class="card-bar" x="52" y="178" width="140" height="8" rx="2"/>
<text class="date-wrong" x="52" y="198">2026年1月9日</text>
<circle class="badge-2" cx="330" cy="187" r="13"/><text class="badge-text" x="330" y="192">2</text>

<!-- legend -->
<g>
  <circle class="badge-1" cx="420" cy="48" r="12"/><text class="badge-text" x="420" y="53">1</text>
  <text class="legend-t" x="442" y="44">見出しが緑にならない</text>
  <text class="legend-s" x="442" y="60">#page-title が .notice より強い</text>
</g>

<g>
  <circle class="badge-2" cx="420" cy="110" r="12"/><text class="badge-text" x="420" y="115">2</text>
  <text class="legend-t" x="442" y="106">一番下の日付だけ薄い</text>
  <text class="legend-s" x="442" y="122">style="color:..." が HTML の中にある</text>
</g>

<text class="foot" x="450" y="200">2つとも「.style.cssを直そうとして直らない」という同じ詰まりを体験する</text>

</svg>
