<svg viewBox="0 0 900 320" role="img" aria-label="同じHTMLツリーに対して、p・.notice・#main-title・.card pという4つのセレクタがそれぞれどの要素にヒットするかを色分けして示す図。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .head { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
  .sel { fill: #15191a; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13px; font-weight: 700; text-anchor: middle; }
  .card-box { fill: none; stroke: #b7bdb8; stroke-width: 1.4; stroke-dasharray: 4 3; }
  .card-box-scope { fill: none; stroke: #a8792f; stroke-width: 2; }
  .card-label { fill: #6b746d; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .card-label-scope { fill: #a8792f; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; font-weight: 700; text-anchor: start; }
  .node { fill: #f2f4f2; stroke: #d7dcd8; stroke-width: 1.4; }
  .node-match { fill: #ffffff; stroke: #1f6f66; stroke-width: 2; }
  .tag { fill: #8d968f; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .tag-match { fill: #164f48; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; font-weight: 700; text-anchor: start; }
  .txt { fill: #8d968f; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11px; text-anchor: start; }
  .txt-match { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11px; font-weight: 700; text-anchor: start; }
  .count { fill: #164f48; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
  .rule { stroke: #d7dcd8; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .head { fill: #e7ece9; }
    .sel { fill: #e7ece9; }
    .card-box { stroke: #3a423f; }
    .card-box-scope { stroke: #e0bc7c; }
    .card-label { fill: #8d968f; }
    .card-label-scope { fill: #e0bc7c; }
    .node { fill: #171b1a; stroke: #2b3230; }
    .node-match { fill: #1a1f1d; stroke: #5fc0b3; }
    .tag { fill: #6b746d; }
    .tag-match { fill: #86d6cb; }
    .txt { fill: #6b746d; }
    .txt-match { fill: #e7ece9; }
    .count { fill: #86d6cb; }
    .rule { stroke: #2b3230; }
  }
</style>

<rect class="bg" x="0" y="0" width="900" height="320"/>

<text class="head" x="450" y="20">同じHTMLツリーでも、セレクタが違えば「光る場所」が変わります</text>

<!-- ============ shared tree structure, repeated per panel ============ -->
<!-- panel template offsets: px = panel x origin -->

<!-- Panel 1: p -->
<g>
  <text class="sel" x="120" y="48">p</text>
  <rect class="node" x="45" y="58" width="150" height="26" rx="6"/>
  <text class="tag" x="53" y="75">h1#main-title</text>
  <rect class="card-box" x="45" y="94" width="150" height="96" rx="6"/>
  <text class="card-label" x="53" y="106">div.card</text>
  <rect class="node-match" x="55" y="112" width="130" height="26" rx="6"/>
  <text class="tag-match" x="63" y="129">p</text>
  <text class="txt-match" x="90" y="129">本文1</text>
  <rect class="node-match" x="55" y="150" width="130" height="26" rx="6"/>
  <text class="tag-match" x="63" y="167">p.notice</text>
  <text class="txt-match" x="120" y="167">お知らせ</text>
  <rect class="node-match" x="45" y="200" width="150" height="26" rx="6"/>
  <text class="tag-match" x="53" y="217">p</text>
  <text class="txt-match" x="80" y="217">フッター文</text>
  <text class="count" x="120" y="242">3件ヒット</text>
</g>

<line class="rule" x1="215" y1="40" x2="215" y2="250"/>

<!-- Panel 2: .notice -->
<g transform="translate(225,0)">
  <text class="sel" x="120" y="48">.notice</text>
  <rect class="node" x="45" y="58" width="150" height="26" rx="6"/>
  <text class="tag" x="53" y="75">h1#main-title</text>
  <rect class="card-box" x="45" y="94" width="150" height="96" rx="6"/>
  <text class="card-label" x="53" y="106">div.card</text>
  <rect class="node" x="55" y="112" width="130" height="26" rx="6"/>
  <text class="tag" x="63" y="129">p</text>
  <text class="txt" x="90" y="129">本文1</text>
  <rect class="node-match" x="55" y="150" width="130" height="26" rx="6"/>
  <text class="tag-match" x="63" y="167">p.notice</text>
  <text class="txt-match" x="120" y="167">お知らせ</text>
  <rect class="node" x="45" y="200" width="150" height="26" rx="6"/>
  <text class="tag" x="53" y="217">p</text>
  <text class="txt" x="80" y="217">フッター文</text>
  <text class="count" x="120" y="242">1件ヒット</text>
</g>

<line class="rule" x1="440" y1="40" x2="440" y2="250"/>

<!-- Panel 3: #main-title -->
<g transform="translate(450,0)">
  <text class="sel" x="120" y="48">#main-title</text>
  <rect class="node-match" x="45" y="58" width="150" height="26" rx="6"/>
  <text class="tag-match" x="53" y="75">h1#main-title</text>
  <rect class="card-box" x="45" y="94" width="150" height="96" rx="6"/>
  <text class="card-label" x="53" y="106">div.card</text>
  <rect class="node" x="55" y="112" width="130" height="26" rx="6"/>
  <text class="tag" x="63" y="129">p</text>
  <text class="txt" x="90" y="129">本文1</text>
  <rect class="node" x="55" y="150" width="130" height="26" rx="6"/>
  <text class="tag" x="63" y="167">p.notice</text>
  <text class="txt" x="120" y="167">お知らせ</text>
  <rect class="node" x="45" y="200" width="150" height="26" rx="6"/>
  <text class="tag" x="53" y="217">p</text>
  <text class="txt" x="80" y="217">フッター文</text>
  <text class="count" x="120" y="242">1件ヒット</text>
</g>

<line class="rule" x1="665" y1="40" x2="665" y2="250"/>

<!-- Panel 4: .card p -->
<g transform="translate(675,0)">
  <text class="sel" x="120" y="48">.card p</text>
  <rect class="node" x="45" y="58" width="150" height="26" rx="6"/>
  <text class="tag" x="53" y="75">h1#main-title</text>
  <rect class="card-box-scope" x="45" y="94" width="150" height="96" rx="6"/>
  <text class="card-label-scope" x="53" y="106">div.card(起点)</text>
  <rect class="node-match" x="55" y="112" width="130" height="26" rx="6"/>
  <text class="tag-match" x="63" y="129">p</text>
  <text class="txt-match" x="90" y="129">本文1</text>
  <rect class="node-match" x="55" y="150" width="130" height="26" rx="6"/>
  <text class="tag-match" x="63" y="167">p.notice</text>
  <text class="txt-match" x="120" y="167">お知らせ</text>
  <rect class="node" x="45" y="200" width="150" height="26" rx="6"/>
  <text class="tag" x="53" y="217">p</text>
  <text class="txt" x="80" y="217">フッター文</text>
  <text class="count" x="120" y="242">2件ヒット(card外は対象外)</text>
</g>

<text class="head" x="450" y="280" style="font-size:12.5px; font-weight:400;">半角スペースは「子孫」の意味です。.card p は div.card の中の p だけを選びます。</text>

</svg>
