<svg viewBox="0 0 900 220" role="img" aria-label="今日やること: README.mdへの追記をgit addでインデックスに置き、git commitでリポジトリに記録し、git logでその記録が履歴に残ったことを確認する。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .num-bg-1 { fill: #a8792f; }
  .num-bg-2 { fill: #1f6f66; }
  .num-bg-3 { fill: #1f6f66; }
  .num { fill: #ffffff; font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 9.5px; text-anchor: start; }
  .line-dim { fill: #4a524e; }
  .line-b { fill: #e0bc7c; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; }
  .line-ok { fill: #86d6cb; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; }
  .line-cmd { fill: #e7ece9; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
  .arrow { stroke: #8d968f; stroke-width: 2; fill: none; }
  .foot { fill: #6b746d; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .t { fill: #e7ece9; }
    .arrow { stroke: #6b746d; }
    .foot { fill: #8d968f; }
  }
</style>

<rect class="bg" x="0" y="0" width="900" height="220"/>

<defs>
  <marker id="fcArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <polygon points="0,0 10,5 0,10" fill="#8d968f"/>
  </marker>
</defs>

<!-- step 1: git add -->
<circle class="num-bg-1" cx="130" cy="24" r="12"/><text class="num" x="130" y="29">1</text>
<text class="t" x="130" y="48">git add でインデックスへ</text>
<rect class="win" x="20" y="58" width="220" height="80" rx="6"/>
<text class="win-title" x="30" y="72">$ git add README.md</text>
<text class="line-cmd" x="30" y="94">$ git status</text>
<text class="line-b" x="30" y="112">Changes to be committed:</text>

<line class="arrow" x1="248" y1="98" x2="292" y2="98" marker-end="url(#fcArrow)"/>

<!-- step 2: git commit -->
<circle class="num-bg-2" cx="420" cy="24" r="12"/><text class="num" x="420" y="29">2</text>
<text class="t" x="420" y="48">git commit で記録する</text>
<rect class="win" x="300" y="58" width="250" height="80" rx="6"/>
<text class="win-title" x="310" y="72">$ git commit -m "..."</text>
<text class="line-ok" x="310" y="94">add a note to</text>
<text class="line-ok" x="310" y="110">git-basics README</text>

<line class="arrow" x1="558" y1="98" x2="602" y2="98" marker-end="url(#fcArrow)"/>

<!-- step 3: git log -->
<circle class="num-bg-3" cx="730" cy="24" r="12"/><text class="num" x="730" y="29">3</text>
<text class="t" x="730" y="48">git log で履歴に残る</text>
<rect class="win" x="610" y="58" width="270" height="80" rx="6"/>
<text class="win-title" x="620" y="72">$ git log</text>
<text class="line-cmd" x="620" y="92">commit a1b2c3d</text>
<text class="line-ok" x="620" y="110">add a note to README</text>

<text class="foot" x="450" y="195">「置く(add)」と「記録する(commit)」が分かれているから、変更を選んで区切りを作れる</text>

</svg>
