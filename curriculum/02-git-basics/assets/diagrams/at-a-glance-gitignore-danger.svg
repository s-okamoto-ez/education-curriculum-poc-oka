<svg viewBox="0 0 700 220" role="img" aria-label="今日やること: git add . を実行する前のgit status出力を見て、本来コミットしてはいけないnode_modulesと.env.localが一緒に巻き込まれようとしていることに気づく。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .win { fill: #1a1f1d; stroke: #a35555; stroke-width: 1.8; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .line-dim { fill: #8d968f; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; }
  .line-danger { fill: #e29a9a; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; font-weight: 700; text-anchor: start; }
  .badge-1 { fill: #a35555; }
  .badge-2 { fill: #a35555; }
  .badge-text { fill: #ffffff; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
  .legend-t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: start; }
  .foot { fill: #6b746d; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .t { fill: #e7ece9; }
    .legend-t { fill: #e7ece9; }
    .foot { fill: #8d968f; }
  }
</style>

<rect class="bg" x="0" y="0" width="700" height="220"/>

<text class="t" x="350" y="26">git add . の前に、この git status を見てください</text>

<rect class="win" x="30" y="42" width="330" height="130" rx="6"/>
<text class="win-title" x="42" y="60">$ git status</text>
<text class="line-dim" x="42" y="80">Untracked files:</text>
<text class="line-danger" x="52" y="100">node_modules/</text>
<text class="line-danger" x="52" y="118">.env.local</text>
<text class="line-dim" x="52" y="138">src/index.ts</text>
<text class="line-dim" x="52" y="154">README.md</text>

<circle class="badge-1" cx="330" cy="100" r="12"/>
<text class="badge-text" x="330" y="105">1</text>
<circle class="badge-2" cx="330" cy="118" r="12"/>
<text class="badge-text" x="330" y="123">2</text>

<text class="legend-t" x="400" y="90">この2つは、うっかり</text>
<text class="legend-t" x="400" y="108">git add . に巻き込まれます</text>
<text class="legend-t" x="400" y="140">ライブラリ一式と、秘密の</text>
<text class="legend-t" x="400" y="158">設定値です</text>

<text class="foot" x="350" y="200">気づかずコミットしてしまう前に、.gitignore で防ぐ方法を学びます</text>

</svg>
