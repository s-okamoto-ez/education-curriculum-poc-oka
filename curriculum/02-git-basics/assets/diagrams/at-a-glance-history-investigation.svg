<svg viewBox="0 0 900 220" role="img" aria-label="今日やること: price-table.csvの消しゴムの行が106円になっているのを見つけ、git blameで犯人のコミットを特定し、正しい108円に手で直す。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .num-bg-1 { fill: #a35555; }
  .num-bg-2 { fill: #a8792f; }
  .num-bg-3 { fill: #1f6f66; }
  .num { fill: #ffffff; font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 9.5px; text-anchor: start; }
  .line-dim { fill: #4a524e; }
  .line-bad { fill: #e29a9a; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; text-anchor: start; font-weight: 700; }
  .line-ok { fill: #86d6cb; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; text-anchor: start; font-weight: 700; }
  .line-cmd { fill: #e0bc7c; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
  .arrow { stroke: #8d968f; stroke-width: 2; fill: none; }
  .foot { fill: #6b746d; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .t { fill: #e7ece9; }
    .arrow { stroke: #6b746d; }
    .foot { fill: #8d968f; }
  }
</style>

<rect class="bg" x="0" y="0" width="900" height="220"/>

<defs>
  <marker id="hiArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <polygon points="0,0 10,5 0,10" fill="#8d968f"/>
  </marker>
</defs>

<!-- step 1: notice the bad value -->
<circle class="num-bg-1" cx="130" cy="24" r="12"/><text class="num" x="130" y="29">1</text>
<text class="t" x="130" y="48">価格がおかしいと気づく</text>
<rect class="win" x="20" y="58" width="220" height="80" rx="6"/>
<text class="win-title" x="30" y="72">price-table.csv</text>
<text class="line-dim" x="30" y="92" style="font-family:ui-monospace,Consolas,monospace;font-size:10px;fill:#8d968f;">消しゴム,100,...</text>
<text class="line-bad" x="30" y="114">税込 106円 (計算は108円)</text>

<line class="arrow" x1="248" y1="98" x2="292" y2="98" marker-end="url(#hiArrow)"/>

<!-- step 2: git blame identifies the culprit -->
<circle class="num-bg-2" cx="420" cy="24" r="12"/><text class="num" x="420" y="29">2</text>
<text class="t" x="420" y="48">git blame で犯人を特定</text>
<rect class="win" x="300" y="58" width="240" height="80" rx="6"/>
<text class="win-title" x="310" y="72">$ git blame price-table.csv</text>
<text class="line-cmd" x="310" y="94">a3f9c1e 消しゴムの行</text>
<text class="line-cmd" x="310" y="110">"軽減税率8%を適用"</text>

<line class="arrow" x1="548" y1="98" x2="592" y2="98" marker-end="url(#hiArrow)"/>

<!-- step 3: fixed by hand -->
<circle class="num-bg-3" cx="720" cy="24" r="12"/><text class="num" x="720" y="29">3</text>
<text class="t" x="720" y="48">手で正しい値に直す</text>
<rect class="win" x="600" y="58" width="260" height="80" rx="6"/>
<text class="win-title" x="610" y="72">price-table.csv</text>
<text class="line-dim" x="610" y="92" style="font-family:ui-monospace,Consolas,monospace;font-size:10px;fill:#8d968f;">消しゴム,100,...</text>
<text class="line-ok" x="610" y="114">税込 108円 に修正</text>

<text class="foot" x="450" y="195">revertでは戻せない状況だと分かったら、正しい値へ手動で直してその理由をコミットに書く</text>

</svg>
