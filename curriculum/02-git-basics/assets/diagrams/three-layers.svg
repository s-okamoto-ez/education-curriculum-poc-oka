<svg viewBox="0 0 760 240" role="img" aria-label="ワークツリーで編集した変更を、買い物かごに入れるようにインデックスへ選んで置き、会計するようにコミットしてリポジトリに記録として残す、3層構造の図。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .box { fill: #ffffff; stroke: #d7dcd8; stroke-width: 1.4; }
  .box-title { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
  .box-sub { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  .icon { fill: #1f6f66; }
  .arrow-line { stroke: #1f6f66; stroke-width: 2; fill: none; }
  .arrow-label { fill: #164f48; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .box { fill: #1a1f1d; stroke: #2b3230; }
    .box-title { fill: #e7ece9; }
    .box-sub { fill: #a9b3ac; }
    .icon { fill: #5fc0b3; }
    .arrow-line { stroke: #5fc0b3; }
    .arrow-label { fill: #86d6cb; }
  }
</style>

<rect class="bg" x="0" y="0" width="760" height="240"/>

<defs>
  <marker id="tlArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <polygon points="0,0 10,5 0,10" class="icon"/>
  </marker>
</defs>

<!-- Box 1: working tree -->
<g>
  <rect class="box" x="20" y="70" width="160" height="130" rx="10"/>
  <g transform="translate(86,86) scale(1.1667)">
    <path class="icon" d="M21 16.4999V4.8999H3V16.4999H10.5V19.4999H7.5V20.9999H16.5V19.4999H13.5V16.4999H21ZM4.5 6.3999H19.5V14.9999H4.5V6.3999Z"/>
  </g>
  <text class="box-title" x="100" y="150">ワークツリー</text>
  <text class="box-sub" x="100" y="170">ファイルを編集する</text>
</g>

<!-- Arrow 1 -->
<line class="arrow-line" x1="188" y1="135" x2="282" y2="135" marker-end="url(#tlArrow)"/>
<text class="arrow-label" x="235" y="118">かごに入れる</text>

<!-- Box 2: index / staging -->
<g>
  <rect class="box" x="290" y="70" width="160" height="130" rx="10"/>
  <g transform="translate(356,86) scale(1.1667)">
    <path class="icon" fill-rule="evenodd" clip-rule="evenodd" d="M7.5 18H20V2.5H7.5V18ZM18.5 16.5H9V4H18.5V16.5ZM4 21.5002H15.8V20.0002H5.5V6.7002H4V21.5002Z"/>
  </g>
  <text class="box-title" x="370" y="150">インデックス</text>
  <text class="box-sub" x="370" y="170">含める変更を選ぶ</text>
</g>

<!-- Arrow 2 -->
<line class="arrow-line" x1="458" y1="135" x2="552" y2="135" marker-end="url(#tlArrow)"/>
<text class="arrow-label" x="505" y="118">会計する</text>

<!-- Box 3: repository -->
<g>
  <rect class="box" x="560" y="70" width="160" height="130" rx="10"/>
  <g transform="translate(626,86) scale(1.1667)">
    <path class="icon" fill-rule="evenodd" clip-rule="evenodd" d="M7.2 5.20031C10.9 1.90031 16.6 2.30031 19.9 6.00031C23.2 9.80031 22.8 15.5003 19.2 18.7003C17.4 20.3003 15.3 21.0003 13.2 21.0003C10.7 21.0003 8.2 20.0003 6.4 18.0003L7.5 17.0003C10.3 20.1003 15 20.4003 18.1 17.6003C21.2 14.8003 21.5 10.1003 18.8 7.00031C16 3.90031 11.3 3.60031 8.2 6.40031C6.6 7.80031 5.7 9.90031 5.7 12.0003L7.8 9.80031L8.9 10.9003L4.9 14.9003L1 10.9003L2 9.90031L4.2 11.9003C4.2 9.40031 5.3 6.90031 7.2 5.20031ZM12 12.7V7.5H13.5V12.1L16.7 15.3L15.7 16.4L12 12.7Z"/>
  </g>
  <text class="box-title" x="640" y="150">リポジトリ</text>
  <text class="box-sub" x="640" y="170">記録として残る</text>
</g>

</svg>
