<svg viewBox="0 0 510 240" role="img" aria-label="ローカルリポジトリは自分のパソコンの中にあり、リモートリポジトリはGitHubのようなサーバ上にあって複数人で共有する。ローカルからリモートへ矢印が伸び、共有する操作を表す。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .box { fill: #ffffff; stroke: #d7dcd8; stroke-width: 1.4; }
  .box-title { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
  .box-sub { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  .tag { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11px; text-anchor: middle; }
  .icon { fill: #1f6f66; }
  .arrow-line { stroke: #1f6f66; stroke-width: 2; fill: none; }
  .arrow-label { fill: #164f48; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .box { fill: #1a1f1d; stroke: #2b3230; }
    .box-title { fill: #e7ece9; }
    .box-sub { fill: #a9b3ac; }
    .tag { fill: #a9b3ac; }
    .icon { fill: #5fc0b3; }
    .arrow-line { stroke: #5fc0b3; }
    .arrow-label { fill: #86d6cb; }
  }
</style>

<rect class="bg" x="0" y="0" width="510" height="240"/>

<defs>
  <marker id="lrArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <polygon points="0,0 10,5 0,10" class="icon"/>
  </marker>
</defs>

<!-- Box 1: local repository -->
<g>
  <rect class="box" x="20" y="70" width="180" height="130" rx="10"/>
  <g transform="translate(96,86) scale(1.1667)">
    <path class="icon" d="M21 16.4999V4.8999H3V16.4999H10.5V19.4999H7.5V20.9999H16.5V19.4999H13.5V16.4999H21ZM4.5 6.3999H19.5V14.9999H4.5V6.3999Z"/>
  </g>
  <text class="box-title" x="110" y="150">ローカルリポジトリ</text>
  <text class="box-sub" x="110" y="170">自分のパソコンの中</text>
  <text class="tag" x="110" y="45">1人ならここで完結</text>
</g>

<!-- Arrow -->
<line class="arrow-line" x1="208" y1="135" x2="302" y2="135" marker-end="url(#lrArrow)"/>
<text class="arrow-label" x="255" y="118">共有する</text>

<!-- Box 2: remote repository -->
<g>
  <rect class="box" x="310" y="70" width="180" height="130" rx="10"/>
  <g transform="translate(386,86) scale(1.1667)">
