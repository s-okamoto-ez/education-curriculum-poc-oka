  </g>
  <text class="box-title" x="400" y="150">リモートリポジトリ</text>
  <text class="box-sub" x="400" y="170">GitHub上にある</text>
  <text class="tag" x="400" y="45">複数人で見る・使う</text>
</g>

</svg>
