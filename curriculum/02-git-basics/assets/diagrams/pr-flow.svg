<svg viewBox="0 0 1010 240" role="img" aria-label="ローカルブランチの変更をgit pushでリモートブランチに送り、Pull Requestを作成してレビューを受け、承認されるとmainへマージされるまでの流れの図。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .box { fill: #ffffff; stroke: #d7dcd8; stroke-width: 1.4; }
  .box-title { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
  .box-sub { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  .icon { fill: #1f6f66; }
  .arrow-line { stroke: #1f6f66; stroke-width: 2; fill: none; }
  .arrow-label { fill: #164f48; font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .box { fill: #1a1f1d; stroke: #2b3230; }
    .box-title { fill: #e7ece9; }
    .box-sub { fill: #a9b3ac; }
    .icon { fill: #5fc0b3; }
    .arrow-line { stroke: #5fc0b3; }
    .arrow-label { fill: #86d6cb; }
  }
</style>

<rect class="bg" x="0" y="0" width="1010" height="240"/>

<defs>
  <marker id="prfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <polygon points="0,0 10,5 0,10" class="icon"/>
  </marker>
</defs>

<!-- Box 1: local branch -->
<g>
  <rect class="box" x="20" y="70" width="160" height="130" rx="10"/>
  <g transform="translate(86,86) scale(1.1667)">
    <path class="icon" d="M11.6 6L9.6 4H2V21H22V6H11.6ZM9 5.5L11 7.5H20.5V10.5H3.5V5.5H9ZM3.5 19.5V12H20.5V19.5H3.5Z"/>
  </g>
  <text class="box-title" x="100" y="150">ローカルブランチ</text>
  <text class="box-sub" x="100" y="170">push前の変更</text>
</g>

<!-- Arrow 1 -->
<line class="arrow-line" x1="188" y1="135" x2="282" y2="135" marker-end="url(#prfArrow)"/>
<text class="arrow-label" x="235" y="118">git push</text>

<!-- Box 2: remote branch -->
<g>
  <rect class="box" x="290" y="70" width="160" height="130" rx="10"/>
  <g transform="translate(356,86) scale(1.1667)">
    <path class="icon" fill-rule="evenodd" clip-rule="evenodd" d="M4.5 19.5H19.5V13H21V21H3V3H11V4.5H4.5V19.5ZM14 4.5V3H21V10H19.5V5.6L10.5 14.5L9.5 13.5L18.4 4.5H14Z"/>
  </g>
  <text class="box-title" x="370" y="150">リモートブランチ</text>
  <text class="box-sub" x="370" y="170">GitHub上に反映</text>
</g>

<!-- Arrow 2 -->
<line class="arrow-line" x1="458" y1="135" x2="552" y2="135" marker-end="url(#prfArrow)"/>
<text class="arrow-label" x="505" y="118">PRを作成</text>

<!-- Box 3: pull request -->
<g>
  <rect class="box" x="560" y="70" width="160" height="130" rx="10"/>
  <g transform="translate(626,86) scale(1.1667)">
    <path class="icon" fill-rule="evenodd" clip-rule="evenodd" d="M18 9.5C18 12.6 19.9 16.1 19.9 16.1L20 16.3V18H4V16.3L4.1 16.1C4.1 16.1 6 12.6 6 9.5C6 7.7 6.8 6.1 8 5C8.5 4.6 9 4.3 9.6 4C9.65 3.95 9.725 3.925 9.8 3.9C9.875 3.875 9.95 3.85 10 3.8C10.1 2.8 10.9 2 12 2C13.1 2 13.9 2.8 14 3.8C14.05 3.85 14.125 3.875 14.2 3.9C14.275 3.925 14.35 3.95 14.4 4C15 4.2 15.5 4.6 16 5C17.2 6.1 18 7.7 18 9.5ZM7.5 9.5C7.5 12.4 6.1 15.5 5.6 16.5H18.4C17.9 15.5 16.5 12.4 16.5 9.5C16.5 8.8 16.3 8.1 16 7.5C15.6 6.6 14.9 5.9 14 5.5C13.4 5.2 12.7 5 12 5C11.3 5 10.6 5.2 10 5.5C9.1 5.9 8.4 6.6 8 7.5C7.7 8.1 7.5 8.8 7.5 9.5ZM14.5 19.5C14.5 20.9 13.4 22 12 22C10.6 22 9.5 20.9 9.5 19.5H14.5Z"/>
  </g>
  <text class="box-title" x="640" y="150">Pull Request</text>
  <text class="box-sub" x="640" y="170">差分をレビューしてもらう</text>
</g>

<!-- Arrow 3 -->
<line class="arrow-line" x1="728" y1="135" x2="822" y2="135" marker-end="url(#prfArrow)"/>
<text class="arrow-label" x="775" y="118">承認後にマージ</text>

<!-- Box 4: main -->
<g>
  <rect class="box" x="830" y="70" width="160" height="130" rx="10"/>
  <g transform="translate(896,86) scale(1.1667)">
    <path class="icon" fill-rule="evenodd" clip-rule="evenodd" d="M2 12C2 17.5 6.5 22 12 22C17.5 22 22 17.5 22 12C22 6.5 17.5 2 12 2C6.5 2 2 6.5 2 12ZM3.5 12C3.5 7.3 7.3 3.5 12 3.5C16.7 3.5 20.5 7.3 20.5 12C20.5 16.7 16.7 20.5 12 20.5C7.3 20.5 3.5 16.7 3.5 12ZM7.19922 12L11.1992 16L17.1992 10L16.0992 9L11.1992 13.9L8.29922 10.9L7.19922 12Z"/>
  </g>
  <text class="box-title" x="910" y="150">main</text>
  <text class="box-sub" x="910" y="170">取り込まれた状態</text>
</g>

</svg>
