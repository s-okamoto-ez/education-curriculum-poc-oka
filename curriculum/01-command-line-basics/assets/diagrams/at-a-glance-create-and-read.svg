<svg viewBox="0 0 700 240" role="img" aria-label="今日やること: sandboxの中にmemo.txtを作り、深いa/b/cディレクトリまで移動してから、同じmemo.txtを①相対パスと②絶対パスの2通りの書き方で読み出す。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .win { fill: #ffffff; stroke: #d7dcd8; stroke-width: 1.4; }
  .node { fill: #465049; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; text-anchor: start; }
  .node-file { fill: #164f48; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; font-weight: 700; text-anchor: start; }
  .node-here { fill: #a8792f; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; font-weight: 700; text-anchor: start; }
  .tree-line { stroke: #b7bdb8; stroke-width: 1.2; fill: none; }
  .badge-1 { fill: #1f6f66; }
  .badge-2 { fill: #a8792f; }
  .badge-text { fill: #ffffff; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .path-1 { stroke: #1f6f66; stroke-width: 1.8; stroke-dasharray: 4 3; fill: none; }
  .path-2 { stroke: #a8792f; stroke-width: 1.8; stroke-dasharray: 4 3; fill: none; }
  .legend-t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 700; text-anchor: start; }
  .legend-s { fill: #465049; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .win { fill: #1a1f1d; stroke: #2b3230; }
    .node { fill: #a9b3ac; }
    .node-file { fill: #86d6cb; }
    .node-here { fill: #e0bc7c; }
    .tree-line { stroke: #3a423f; }
    .legend-t { fill: #e7ece9; }
    .legend-s { fill: #a9b3ac; }
    .foot { fill: #a9b3ac; }
  }
</style>

<rect class="bg" x="0" y="0" width="700" height="240"/>

<rect class="win" x="20" y="20" width="340" height="180" rx="8"/>

<text class="node-file" x="40" y="46">sandbox/memo.txt</text>

<line class="tree-line" x1="46" y1="52" x2="46" y2="140"/>
<line class="tree-line" x1="46" y1="70" x2="60" y2="70"/>
<text class="node" x="64" y="74">a/</text>
<line class="tree-line" x1="60" y1="70" x2="60" y2="105"/>
<line class="tree-line" x1="60" y1="98" x2="80" y2="98"/>
<text class="node" x="84" y="102">b/</text>
<line class="tree-line" x1="80" y1="98" x2="80" y2="133"/>
<line class="tree-line" x1="80" y1="126" x2="100" y2="126"/>
<text class="node-here" x="104" y="130">c/ ← 今ここ</text>

<!-- two dashed paths pointing back up to memo.txt -->
<path class="path-1" d="M 150 130 C 250 130, 250 60, 155 46"/>
<path class="path-2" d="M 150 138 C 300 170, 340 100, 158 48"/>

<circle class="badge-1" cx="150" cy="130" r="11"/><text class="badge-text" x="150" y="135">1</text>
<circle class="badge-2" cx="150" cy="150" r="11"/><text class="badge-text" x="150" y="155">2</text>

<!-- legend -->
<g>
  <circle class="badge-1" cx="390" cy="60" r="11"/><text class="badge-text" x="390" y="65">1</text>
  <text class="legend-t" x="410" y="56">相対パスで読む</text>
  <text class="legend-s" x="410" y="72">cat ../../../memo.txt</text>
</g>

<g>
  <circle class="badge-2" cx="390" cy="110" r="11"/><text class="badge-text" x="390" y="115">2</text>
  <text class="legend-t" x="410" y="106">絶対パスで読む</text>
  <text class="legend-s" x="410" y="122">cat /home/you/.../sandbox/memo.txt</text>
</g>

<text class="foot" x="350" y="222">c/ の奥にいても、書き方を変えれば同じ memo.txt に届く</text>

</svg>
