<svg viewBox="0 0 900 200" role="img" aria-label="今日やること: 今いる場所から、cd ..で1つ上へ、cd ~でホームへ、cd リポジトリのパスでeducation-curriculum-pocの中へと、3種類の移動を実際に行き来する。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .num-bg-1 { fill: #1f6f66; }
  .num-bg-2 { fill: #a8792f; }
  .num-bg-3 { fill: #a35555; }
  .num { fill: #ffffff; font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 9.5px; text-anchor: start; }
  .cmd { fill: #e7ece9; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; text-anchor: start; }
  .cmd-dim { fill: #6b746d; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .result-1 { fill: #7fe0d2; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .result-2 { fill: #e0bc7c; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .result-3 { fill: #e29a9a; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
  .s { fill: #6b746d; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 10.5px; text-anchor: middle; }
  .arrow { stroke: #8d968f; stroke-width: 2; fill: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .t { fill: #e7ece9; }
    .s { fill: #8d968f; }
    .arrow { stroke: #6b746d; }
  }
</style>

<rect class="bg" x="0" y="0" width="900" height="200"/>

<defs>
  <marker id="wamArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <polygon points="0,0 10,5 0,10" fill="#8d968f"/>
  </marker>
</defs>

<!-- step 1: cd .. -->
<circle class="num-bg-1" cx="130" cy="24" r="12"/><text class="num" x="130" y="29">1</text>
<text class="t" x="130" y="48">1つ上へ移動</text>

<rect class="win" x="20" y="58" width="220" height="80" rx="6"/>
<text class="win-title" x="30" y="72">黒い画面</text>
<text class="cmd" x="30" y="90">$ pwd</text>
<text class="cmd-dim" x="30" y="104">.../curriculum/01-command-line-basics</text>
<text class="cmd" x="30" y="120">$ cd ..</text>

<line class="arrow" x1="248" y1="98" x2="292" y2="98" marker-end="url(#wamArrow)"/>

<!-- step 2: cd ~ -->
<circle class="num-bg-2" cx="420" cy="24" r="12"/><text class="num" x="420" y="29">2</text>
<text class="t" x="420" y="48">ホームへジャンプ</text>

<rect class="win" x="300" y="58" width="220" height="80" rx="6"/>
<text class="win-title" x="310" y="72">黒い画面</text>
<text class="cmd" x="310" y="90">$ cd ~</text>
<text class="cmd" x="310" y="106">$ pwd</text>
<text class="result-2" x="310" y="122">/home/you</text>

<line class="arrow" x1="528" y1="98" x2="572" y2="98" marker-end="url(#wamArrow)"/>

<!-- step 3: cd to repo -->
<circle class="num-bg-3" cx="710" cy="24" r="12"/><text class="num" x="710" y="29">3</text>
<text class="t" x="710" y="48">リポジトリの中へ</text>

<rect class="win" x="600" y="58" width="260" height="80" rx="6"/>
<text class="win-title" x="610" y="72">黒い画面</text>
<text class="cmd" x="610" y="90">$ cd .../education-curriculum-poc</text>
<text class="cmd" x="610" y="106">$ pwd &amp;&amp; ls</text>
<text class="result-3" x="610" y="122">curriculum  README.md ...</text>

<text class="s" x="450" y="172">同じ「移動」でも、../ / ~ / パスの直接指定は仕組みが違います。3つとも自分の手で行き来する</text>

</svg>
