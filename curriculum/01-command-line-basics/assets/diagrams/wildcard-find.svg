<svg viewBox="0 0 1000 340" role="img" aria-label="ワイルドカードとfindの違いを示す図。ls logs*.log はシェルが自分でファイル名を展開してから一覧を渡すのに対し、find . -name はfindコマンド自身がディレクトリを再帰的にたどりながら名前を照合する。findはサブディレクトリの奥まで探せるが、ワイルドカードは今いる場所の直下しか展開しない。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .term { fill: #1a1f1d; stroke: #d7dcd8; stroke-width: 1.4; }
  .code { fill: #7fe0d2; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 14px; }
  .code-star { fill: #ffd48a; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 14px; font-weight: 700; }
  .prompt { fill: #8b958e; font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
  .box { fill: #ffffff; stroke: #d7dcd8; stroke-width: 1.4; }
  .node { fill: #ffffff; stroke: #b9c2bb; stroke-width: 1.4; }
  .node-hit { fill: #d7e9e4; stroke: #1f6f66; stroke-width: 1.8; }
  .nname { fill: #465049; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; text-anchor: middle; }
  .nname-hit { fill: #164f48; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; font-weight: 700; text-anchor: middle; }
  .branch { stroke: #b9c2bb; stroke-width: 1.3; fill: none; }
  .title { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 13.5px; font-weight: 700; }
  .body { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 13px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .term { fill: #0c0f0e; stroke: #2b3230; }
    .box { fill: #1a1f1d; stroke: #2b3230; }
    .node { fill: #1a1f1d; stroke: #3a423f; }
    .node-hit { fill: #24403b; stroke: #5fc0b3; }
    .nname { fill: #a9b3ac; }
    .nname-hit { fill: #86d6cb; }
    .branch { stroke: #3a423f; }
    .title { fill: #e7ece9; }
    .body { fill: #a9b3ac; }
    .foot { fill: #a9b3ac; }
  }
</style>

<rect class="bg" x="0" y="0" width="1000" height="340"/>

<!-- LEFT: wildcard -->
<g>
  <rect class="box" x="30" y="24" width="440" height="266" rx="10"/>
  <text class="title" x="54" y="52">ワイルドカード — シェルが展開してから渡す</text>

  <rect class="term" x="54" y="66" width="392" height="34" rx="6"/>
  <text x="66" y="88"><tspan class="prompt">$ </tspan><tspan class="code">ls logs/</tspan><tspan class="code-star">*.log</tspan></text>

  <!-- only top-level flat listing -->
  <g>
    <path class="branch" d="M120 148 L120 172 L160 172"/>
    <path class="branch" d="M120 148 L120 172"/>
    <rect class="node" x="70" y="128" width="100" height="20" rx="4"/>
    <text class="nname" x="120" y="142">logs/</text>

    <rect class="node-hit" x="160" y="166" width="150" height="20" rx="4"/>
    <text class="nname-hit" x="235" y="180">app-2026-04.log</text>
    <rect class="node-hit" x="160" y="192" width="150" height="20" rx="4"/>
    <text class="nname-hit" x="235" y="206">app-2026-05.log</text>
    <rect class="node-hit" x="160" y="218" width="150" height="20" rx="4"/>
    <text class="nname-hit" x="235" y="232">app-2026-06.log</text>
  </g>

  <text class="body" x="54" y="266">今いる場所の直下しか見ない。</text>
  <text class="body" x="54" y="282">「見つける」のではなく、名前をその場で展開している</text>
</g>

<!-- RIGHT: find -->
<g>
  <rect class="box" x="530" y="24" width="440" height="266" rx="10"/>
  <text class="title" x="554" y="52">find — コマンド自身が奥までたどる</text>

  <rect class="term" x="554" y="66" width="392" height="34" rx="6"/>
  <text x="566" y="88"><tspan class="prompt">$ </tspan><tspan class="code">find . -name </tspan><tspan class="code-star">"*.ts"</tspan></text>

  <g>
    <path class="branch" d="M600 130 L600 152 L640 152"/>
    <path class="branch" d="M600 130 L600 176 L640 176"/>
    <path class="branch" d="M600 130 L600 200 L640 200"/>
    <rect class="node" x="560" y="120" width="80" height="20" rx="4"/>
    <text class="nname" x="600" y="134">. (project)</text>

    <rect class="node" x="640" y="142" width="70" height="20" rx="4"/>
    <text class="nname" x="675" y="156">config/</text>
    <rect class="node" x="640" y="166" width="70" height="20" rx="4"/>
    <text class="nname" x="675" y="180">logs/</text>
    <rect class="node" x="640" y="190" width="70" height="20" rx="4"/>
    <text class="nname" x="675" y="204">src/</text>

    <path class="branch" d="M710 200 L730 200 L730 224 L760 224"/>
    <path class="branch" d="M710 200 L730 200 L730 248 L760 248"/>
    <path class="branch" d="M710 200 L730 200 L730 272 L760 272"/>
    <rect class="node-hit" x="760" y="214" width="130" height="20" rx="4"/>
    <text class="nname-hit" x="825" y="228">timeline.ts</text>
    <rect class="node-hit" x="760" y="238" width="130" height="20" rx="4"/>
    <text class="nname-hit" x="825" y="252">post.ts</text>
    <rect class="node-hit" x="760" y="262" width="130" height="20" rx="4"/>
    <text class="nname-hit" x="825" y="276">user.ts</text>
  </g>
</g>

<text class="foot" x="500" y="320">「今いる場所しか見ないワイルドカード」と「奥までもぐる find」。目的に応じて使い分けます。</text>

</svg>
