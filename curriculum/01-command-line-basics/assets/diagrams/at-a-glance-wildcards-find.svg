<svg viewBox="0 0 700 220" role="img" aria-label="今日やること: srcディレクトリの奥に3つの.tsファイルがあるプロジェクトで、①ls *.tsは直下しか見ないので0件、②find . -name *.tsは奥まで探して3件見つけることを比較する。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .win { fill: #ffffff; stroke: #d7dcd8; stroke-width: 1.4; }
  .node { fill: #465049; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; text-anchor: start; }
  .node-file { fill: #164f48; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; }
  .tree-line { stroke: #b7bdb8; stroke-width: 1.2; fill: none; }
  .badge-1 { fill: #a35555; }
  .badge-2 { fill: #1f6f66; }
  .badge-text { fill: #ffffff; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .legend-t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 700; text-anchor: start; }
  .legend-s { fill: #465049; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .win { fill: #1a1f1d; stroke: #2b3230; }
    .node { fill: #a9b3ac; }
    .node-file { fill: #86d6cb; }
    .tree-line { stroke: #3a423f; }
    .legend-t { fill: #e7ece9; }
    .legend-s { fill: #a9b3ac; }
    .foot { fill: #a9b3ac; }
  }
</style>

<rect class="bg" x="0" y="0" width="700" height="220"/>

<rect class="win" x="20" y="20" width="340" height="160" rx="8"/>

<text class="node" x="40" y="44">project/ ← 今ここ</text>
<line class="tree-line" x1="46" y1="50" x2="46" y2="150"/>
<line class="tree-line" x1="46" y1="70" x2="60" y2="70"/>
<text class="node" x="64" y="74">config/</text>
<line class="tree-line" x1="46" y1="98" x2="60" y2="98"/>
<text class="node" x="64" y="102">logs/</text>
<line class="tree-line" x1="46" y1="126" x2="60" y2="126"/>
<text class="node" x="64" y="130">src/</text>
<line class="tree-line" x1="60" y1="126" x2="60" y2="164"/>
<line class="tree-line" x1="60" y1="140" x2="80" y2="140"/>
<text class="node-file" x="84" y="144">post.ts</text>
<line class="tree-line" x1="60" y1="152" x2="80" y2="152"/>
<text class="node-file" x="84" y="156">timeline.ts</text>
<line class="tree-line" x1="60" y1="164" x2="80" y2="164"/>
<text class="node-file" x="84" y="168">user.ts</text>

<!-- legend -->
<g>
  <circle class="badge-1" cx="400" cy="60" r="11"/><text class="badge-text" x="400" y="65">1</text>
  <text class="legend-t" x="420" y="56">ls *.ts (直下だけ)</text>
  <text class="legend-s" x="420" y="72">→ 0件(src/の中は見えない)</text>
</g>

<g>
  <circle class="badge-2" cx="400" cy="110" r="11"/><text class="badge-text" x="400" y="115">2</text>
  <text class="legend-t" x="420" y="106">find . -name "*.ts" (奥まで)</text>
  <text class="legend-s" x="420" y="122">→ 3件(post/timeline/user.ts)</text>
</g>

<text class="foot" x="350" y="202">ワイルドカードは今いる場所の直下しか見ない。奥まで探すには find を使う</text>

</svg>
