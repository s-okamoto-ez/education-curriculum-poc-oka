<svg viewBox="0 0 1000 260" role="img" aria-label="キーボードから打った文字がシェルに届き、シェルがそれを解釈してOSに指示を出し、OSがファイルやプログラムを操作して、結果がシェルを通して画面に表示されるまでの流れの図。シェルは人間とOSの間に立つ通訳の役割を持つ。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .box { fill: #ffffff; stroke: #d7dcd8; stroke-width: 1.4; }
  .box-accent { fill: #ffffff; stroke: #1f6f66; stroke-width: 2.2; }
  .box-title { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
  .box-sub { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  .icon { fill: #1f6f66; }
  .arrow-line { stroke: #1f6f66; stroke-width: 2; fill: none; }
  .arrow-back { stroke: #8b958e; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  .arrow-label { fill: #164f48; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
  .arrow-label-back { fill: #6b746d; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; text-anchor: middle; }
  .badge { fill: #164f48; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .mute { fill: #8b958e; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .box { fill: #1a1f1d; stroke: #2b3230; }
    .box-accent { fill: #1a1f1d; stroke: #5fc0b3; }
    .box-title { fill: #e7ece9; }
    .box-sub { fill: #a9b3ac; }
    .icon { fill: #5fc0b3; }
    .arrow-line { stroke: #5fc0b3; }
    .arrow-back { stroke: #6d766f; }
    .arrow-label { fill: #86d6cb; }
    .arrow-label-back { fill: #8d968f; }
    .badge { fill: #86d6cb; }
    .mute { fill: #6d766f; }
  }
</style>

<rect class="bg" x="0" y="0" width="1000" height="260"/>

<defs>
  <marker id="srArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <polygon points="0,0 10,5 0,10" class="icon"/>
  </marker>
  <marker id="srArrowBack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <polygon points="0,0 10,5 0,10" class="mute"/>
  </marker>
</defs>

<!-- Box 1: you -->
<g>
  <rect class="box" x="20" y="56" width="170" height="126" rx="10"/>
  <g transform="translate(91,72) scale(1.1667)">
    <path class="icon" fill-rule="evenodd" clip-rule="evenodd" d="M15 6.5C15 4.8 13.7 3.5 12 3.5C10.3 3.5 9 4.8 9 6.5C9 8.2 10.3 9.5 12 9.5C13.7 9.5 15 8.2 15 6.5ZM7.5 6.5C7.5 4 9.5 2 12 2C14.5 2 16.5 4 16.5 6.5C16.5 9 14.5 11 12 11C9.5 11 7.5 9 7.5 6.5ZM19.5 22.0001H21H21.1V20.8001C21.1 16.6001 17.6 13.1001 13.3 13.1001H10.8C6.5 13.1001 3 16.5001 3 20.8001V22.0001H4.6V20.8001C4.6 17.4001 7.4 14.6001 10.8 14.6001H13.3C16.7 14.6001 19.5 17.4001 19.5 20.8001V22.0001Z"/>
  </g>
  <text class="box-title" x="105" y="136">あなた</text>
  <text class="box-sub" x="105" y="156">キーボードで打つ</text>
</g>

<line class="arrow-line" x1="198" y1="112" x2="292" y2="112" marker-end="url(#srArrow)"/>
<text class="arrow-label" x="245" y="98">文字</text>

<!-- Box 2: shell (accent) -->
<g>
  <rect class="box-accent" x="300" y="56" width="200" height="126" rx="10"/>
  <text class="badge" x="400" y="46">ここを学びます</text>
  <g transform="translate(386,72) scale(1.1667)">
    <path class="icon" d="M21 16.4999V4.8999H3V16.4999H10.5V19.4999H7.5V20.9999H16.5V19.4999H13.5V16.4999H21ZM4.5 6.3999H19.5V14.9999H4.5V6.3999Z"/>
  </g>
  <text class="box-title" x="400" y="136">シェル</text>
  <text class="box-sub" x="400" y="156">文字を「命令」に翻訳する</text>
</g>

<line class="arrow-line" x1="508" y1="112" x2="602" y2="112" marker-end="url(#srArrow)"/>
<text class="arrow-label" x="555" y="98">命令</text>

<!-- Box 3: OS -->
<g>
  <rect class="box" x="610" y="56" width="170" height="126" rx="10"/>
  <g transform="translate(681,72) scale(1.1667)">
    <path class="icon" fill-rule="evenodd" clip-rule="evenodd" d="M4 2H16.7L20 5.2V22H4V2ZM5.5 3.5V20.5H18.5V6.5H15.5V3.5H5.5ZM7 11H17V12.5H7V11ZM17 8H7V9.5H17V8ZM9.39844 15.1999L11.2984 16.8999L14.5984 13.8999L15.5984 15.0999L11.2984 18.9999L8.39844 16.2999L9.39844 15.1999Z"/>
  </g>
  <text class="box-title" x="695" y="136">OS</text>
  <text class="box-sub" x="695" y="156">実際に処理する</text>
</g>

<line class="arrow-line" x1="788" y1="112" x2="862" y2="112" marker-end="url(#srArrow)"/>

<!-- Box 4: files -->
<g>
  <rect class="box" x="870" y="56" width="110" height="126" rx="10"/>
  <g transform="translate(911,80) scale(1.1667)">
    <path class="icon" d="M11.6 6L9.6 4H2V21H22V6H11.6ZM9 5.5L11 7.5H20.5V10.5H3.5V5.5H9ZM3.5 19.5V12H20.5V19.5H3.5Z"/>
  </g>
  <text class="box-title" x="925" y="140">ファイル</text>
</g>

<!-- return path -->
<path class="arrow-back" d="M925 190 L925 218 L105 218 L105 190" marker-end="url(#srArrowBack)"/>
<text class="arrow-label-back" x="515" y="236">結果は、来た道をそのまま逆にたどって画面に表示される</text>

</svg>
