<svg viewBox="0 0 900 260" role="img" aria-label="今日やること: postsテーブルに保存されているlikes列の数字と、likesテーブルから実際にGROUP BYで数えた件数を突き合わせる。p003は保存値41に対し実数は4件と大きく食い違い、一致するのはp012の1件だけ。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .badge-1 { fill: #a8792f; }
  .badge-text { fill: #ffffff; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .hdr { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .row { fill: #dfe3e0; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; text-anchor: start; }
  .row-ng { fill: #e29a9a; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; font-weight: 700; text-anchor: start; }
  .row-ok { fill: #86d6cb; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; font-weight: 700; text-anchor: start; }
  .rule { stroke: #2b3230; stroke-width: 1; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; }
  .s { fill: #6b746d; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11px; text-anchor: start; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .t { fill: #e7ece9; }
    .s { fill: #a9b3ac; }
    .foot { fill: #a9b3ac; }
  }
</style>

<rect class="bg" x="0" y="0" width="900" height="260"/>

<text class="t" x="450" y="26">posts.likes(保存値)と likes テーブルの実カウントを突き合わせる</text>

<rect class="win" x="220" y="46" width="460" height="164" rx="8"/>
<text class="hdr" x="240" y="68">id      stored_likes   actual_likes</text>
<line class="rule" x1="240" y1="76" x2="660" y2="76"/>
<text class="row" x="240" y="98">p001    12             10</text>
<text class="row-ng" x="240" y="120">p003    41             4   ← 大きく食い違う</text>
<text class="row" x="240" y="142">...     ...            ...   (他8件も食い違う)</text>
<text class="row-ok" x="240" y="164">p012    7              7   ← 一致するのはここだけ</text>

<circle class="badge-1" cx="700" cy="128" r="13"/>
<text class="badge-text" x="700" y="133">1</text>

<text class="s" x="726" y="120">12件中、一致するのは1件のみ</text>
<text class="s" x="726" y="138">残り11件はズレている</text>

<text class="foot" x="450" y="234">影響するのは常に「同じ posts テーブルの likes 列」です。食い違いに正解はなく、気づけたかどうかが到達点</text>

</svg>
