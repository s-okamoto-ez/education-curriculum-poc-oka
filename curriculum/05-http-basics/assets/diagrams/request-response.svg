<svg viewBox="0 0 640 260" role="img" aria-label="クライアント(ブラウザやcurl)がサーバーにリクエストを送り、サーバーがレスポンスを返す。往復の会話であることを表す図。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .box { fill: #ffffff; stroke: #d7dcd8; stroke-width: 1.4; }
  .box-title { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
  .box-sub { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  .icon { fill: #1f6f66; }
  .arrow-line { stroke: #1f6f66; stroke-width: 2; fill: none; }
  .arrow-label { fill: #164f48; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .box { fill: #1a1f1d; stroke: #2b3230; }
    .box-title { fill: #e7ece9; }
    .box-sub { fill: #a9b3ac; }
    .icon { fill: #5fc0b3; }
    .arrow-line { stroke: #5fc0b3; }
    .arrow-label { fill: #86d6cb; }
  }
</style>

<rect class="bg" x="0" y="0" width="640" height="260"/>

<defs>
  <marker id="rrArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <polygon points="0,0 10,5 0,10" class="icon"/>
  </marker>
</defs>

<!-- Box 1: client -->
<g>
  <rect class="box" x="40" y="60" width="220" height="140" rx="10"/>
  <g transform="translate(136,76) scale(1.1667)">
    <path class="icon" d="M21 16.4999V4.8999H3V16.4999H10.5V19.4999H7.5V20.9999H16.5V19.4999H13.5V16.4999H21ZM4.5 6.3999H19.5V14.9999H4.5V6.3999Z"/>
  </g>
  <text class="box-title" x="150" y="140">クライアント</text>
  <text class="box-sub" x="150" y="160">ブラウザ / curl</text>
</g>

<!-- Box 2: server (no fitting icon in the asset set; left as text-only rather than forcing one) -->
<g>
  <rect class="box" x="380" y="60" width="220" height="140" rx="10"/>
  <text class="box-title" x="490" y="130">サーバー</text>
  <text class="box-sub" x="490" y="155">リクエストを処理して返す</text>
</g>

<!-- Arrow 1: request, client -> server -->
<line class="arrow-line" x1="268" y1="108" x2="372" y2="108" marker-end="url(#rrArrow)"/>
<text class="arrow-label" x="320" y="92">リクエスト</text>

<!-- Arrow 2: response, server -> client -->
<line class="arrow-line" x1="372" y1="172" x2="268" y2="172" marker-end="url(#rrArrow)"/>
<text class="arrow-label" x="320" y="195">レスポンス</text>

</svg>
