<svg viewBox="0 0 720 190" role="img" aria-label="今日やること: /old-pageにcurlを送ると301とLocation: /new-pageが返り、-Lを付けて送り直すと自動でnew-pageまで追いかけて200になることを確認する。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .num-bg-1 { fill: #1f6f66; }
  .num-bg-2 { fill: #1f6f66; }
  .num { fill: #ffffff; font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 9.5px; text-anchor: start; }
  .cmd { fill: #e7ece9; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; }
  .hit { fill: #e0bc7c; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; font-weight: 700; text-anchor: start; }
  .ok { fill: #7fe0d2; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; font-weight: 700; text-anchor: start; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
  .s { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  .arrow { stroke: #8d968f; stroke-width: 2; fill: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .t { fill: #e7ece9; }
    .s { fill: #a9b3ac; }
    .arrow { stroke: #6b746d; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="190"/>
<defs>
  <marker id="agRd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <polygon points="0,0 10,5 0,10" fill="#8d968f"/>
  </marker>
</defs>

<circle class="num-bg-1" cx="200" cy="24" r="12"/><text class="num" x="200" y="29">1</text>
<text class="t" x="200" y="48">-L 無しで送る</text>
<rect class="win" x="40" y="58" width="320" height="90" rx="6"/>
<text class="win-title" x="50" y="72">ターミナル</text>
<text class="cmd" x="50" y="90">$ curl -sD - -o /dev/null \</text>
<text class="cmd" x="50" y="104">    localhost:3300/old-page</text>
<text class="hit" x="50" y="126">301, Location: /new-page</text>

<line class="arrow" x1="380" y1="103" x2="424" y2="103" marker-end="url(#agRd)"/>

<circle class="num-bg-2" cx="600" cy="24" r="12"/><text class="num" x="600" y="29">2</text>
<text class="t" x="600" y="48">-L を付けて送り直す</text>
<rect class="win" x="440" y="58" width="240" height="90" rx="6"/>
<text class="win-title" x="450" y="72">ターミナル</text>
<text class="cmd" x="450" y="90">$ curl -L ... /old-page</text>
<text class="ok" x="450" y="112">→ 自動で /new-page へ</text>
<text class="ok" x="450" y="128">200 OK</text>

<text class="s" x="360" y="172">-L が無いと案内の1通目しか見えない。自動で追いかけるのはブラウザの仕事</text>
</svg>
