<svg viewBox="0 0 528 432" role="img" aria-label="「つながるノート」のAPIデモ画面。投稿を読み込むボタンとプロフィールを読み込むボタンがあり、投稿を読み込むと、いいね数つきの投稿一覧がその場に表示される。演習07〜11でこのAPIサーバー(server.js)の不具合を直していく。" xmlns="http://www.w3.org/2000/svg">
<style>
  .page-bg { fill: #eef1ef; }
  .frame { fill: #ffffff; stroke: #d7dbd8; stroke-width: 1.2; }
  .chrome { fill: #f2f4f2; }
  .urlbar { fill: #ffffff; stroke: #d7dbd8; stroke-width: 1; }
  .urltext { fill: #5b645d; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; text-anchor: start; }
  .leader { stroke: #1f6f66; stroke-width: 1.5; }
  .dotm { fill: #1f6f66; stroke: #ffffff; stroke-width: 1.5; }
  .bub { fill: #1f6f66; }
  .bt { fill: #ffffff; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .page-bg { fill: #121615; }
    .frame { fill: #1a1f1d; stroke: #2b3230; }
    .chrome { fill: #202523; }
    .urlbar { fill: #1a1f1d; stroke: #2b3230; }
    .urltext { fill: #a9b3ac; }
    .foot { fill: #a9b3ac; }
  }
</style>
<rect class="page-bg" x="0" y="0" width="528" height="432"/>
<rect class="frame" x="20" y="20" width="488" height="358" rx="10"/>
<rect class="chrome" x="20" y="20" width="488" height="30" rx="10"/>
<rect class="chrome" x="20" y="40" width="488" height="10"/>
<circle fill="#e29a9a" cx="34" cy="39" r="5"/><circle fill="#e0bc7c" cx="50" cy="39" r="5"/><circle fill="#86d6cb" cx="66" cy="39" r="5"/>
<rect class="urlbar" x="82" y="29" width="414" height="20" rx="5"/>
<text class="urltext" x="90" y="46">http://localhost:3300/</text>
<image x="24" y="54" width="480" height="320" href="data:image/png;base64,"/>

    <line class="leader" x1="84" y1="157" x2="114" y2="256.5"/>
    <circle class="dotm" cx="84" cy="157" r="5"/>
    <rect class="bub" x="34" y="234" width="160" height="45" rx="8"/>
    <text class="bt" x="114" y="254">投稿一覧を取得</text>
    <text class="bt" x="114" y="269">(GET /api/posts)</text>

    <line class="leader" x1="284" y1="157" x2="309" y2="256.5"/>
    <circle class="dotm" cx="284" cy="157" r="5"/>
    <rect class="bub" x="214" y="234" width="190" height="45" rx="8"/>
    <text class="bt" x="309" y="254">プロフィールを取得</text>
    <text class="bt" x="309" y="269">(未ログイン → 401)</text>

    <line class="leader" x1="174" y1="204" x2="404" y2="314"/>
    <circle class="dotm" cx="174" cy="204" r="5"/>
    <rect class="bub" x="314" y="289" width="180" height="50" rx="8"/>
    <text class="bt" x="404" y="311.5">APIから取得した投稿</text>
    <text class="bt" x="404" y="326.5">(いいね数つき)</text>
<text class="foot" x="264" y="420">演習07〜11で、このAPIサーバー(server.js)の不具合を直していく</text>
</svg>
