<svg viewBox="0 0 720 190" role="img" aria-label="今日やること: curl -I https://example.com と curl -I https://httpbin.org/status/404 を送り比べ、ステータスコードが200と404で違うことを自分の目で確認する。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .num-bg-1 { fill: #1f6f66; }
  .num-bg-2 { fill: #a35555; }
  .num { fill: #ffffff; font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 9.5px; text-anchor: start; }
  .cmd { fill: #e7ece9; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; text-anchor: start; }
  .ok { fill: #7fe0d2; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: start; }
  .ng { fill: #e29a9a; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: start; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
  .s { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .t { fill: #e7ece9; }
    .s { fill: #a9b3ac; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="190"/>

<circle class="num-bg-1" cx="200" cy="24" r="12"/><text class="num" x="200" y="29">1</text>
<text class="t" x="200" y="48">存在するページに送る</text>
<rect class="win" x="40" y="58" width="320" height="80" rx="6"/>
<text class="win-title" x="50" y="72">ターミナル</text>
<text class="cmd" x="50" y="92">$ curl -I https://example.com</text>
<text class="ok" x="50" y="114">HTTP/1.1 200 OK</text>

<circle class="num-bg-2" cx="520" cy="24" r="12"/><text class="num" x="520" y="29">2</text>
<text class="t" x="520" y="48">無いページに送る</text>
<rect class="win" x="360" y="58" width="320" height="80" rx="6"/>
<text class="win-title" x="370" y="72">ターミナル</text>
<text class="cmd" x="370" y="92">$ curl -I https://httpbin.org/status/404</text>
<text class="ng" x="370" y="114">HTTP/1.1 404 Not Found</text>

<text class="s" x="360" y="170">同じ curl -I でも、返ってくる3桁の数字だけで「結果」が伝わる</text>
</svg>
