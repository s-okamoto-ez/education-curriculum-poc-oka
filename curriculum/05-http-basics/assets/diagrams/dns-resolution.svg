<svg viewBox="0 0 1000 360" role="img" aria-label="URLを入力してからHTTPの会話が始まるまでの3段階の図。まずホスト名をDNSでIPアドレスに変換し、次にそのIPアドレスの決まったポート番号に接続し、最後にHTTPのリクエストとレスポンスのやり取りが始まる。つながらないときは、この3段階のどこで止まっているかを切り分ける。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .box { fill: #ffffff; stroke: #d7dcd8; stroke-width: 1.4; }
  .term { fill: #1a1f1d; stroke: #d7dcd8; stroke-width: 1.4; }
  .code { fill: #7fe0d2; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 15px; }
  .code-d { fill: #ffd48a; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 15px; font-weight: 700; }
  .code-p { fill: #9fd0ff; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 15px; font-weight: 700; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; }
  .s { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  .val { fill: #164f48; font-family: ui-monospace, Consolas, monospace; font-size: 13px; font-weight: 700; text-anchor: middle; }
  .num { fill: #ffffff; font-family: ui-monospace, Consolas, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
  .num-bg { fill: #1f6f66; }
  .icon { fill: #1f6f66; }
  .arrow { stroke: #1f6f66; stroke-width: 2.2; fill: none; }
  .fail { fill: #a35555; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  .foot { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 13px; text-anchor: middle; }
  .rule { stroke: #d7dcd8; stroke-width: 1.2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .box { fill: #1a1f1d; stroke: #2b3230; }
    .term { fill: #0c0f0e; stroke: #2b3230; }
    .t { fill: #e7ece9; }
    .s { fill: #a9b3ac; }
    .val { fill: #86d6cb; }
    .num-bg { fill: #5fc0b3; }
    .num { fill: #0c0f0e; }
    .icon { fill: #5fc0b3; }
    .arrow { stroke: #5fc0b3; }
    .fail { fill: #e29a9a; }
    .foot { fill: #a9b3ac; }
    .rule { stroke: #2b3230; }
  }
</style>

<rect class="bg" x="0" y="0" width="1000" height="360"/>

<defs>
  <marker id="dnArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <polygon points="0,0 10,5 0,10" class="icon"/>
  </marker>
</defs>

<!-- URL bar -->
<rect class="term" x="300" y="24" width="400" height="44" rx="8"/>
<text x="326" y="53"><tspan class="code">https://</tspan><tspan class="code-d">example.com</tspan><tspan class="code">/about</tspan></text>
<text class="s" x="500" y="88">ブラウザにこう入力したとき、裏側で起きていること</text>

<!-- step 1 -->
<g>
  <rect class="box" x="34" y="112" width="280" height="130" rx="10"/>
  <circle class="num-bg" cx="52" cy="130" r="11"/><text class="num" x="52" y="134">1</text>
  <g transform="translate(160,132) scale(0.95)">
    <path class="icon" d="M21 20.5L15 14.5C16.2 13.2 16.9 11.4 16.9 9.5C17 5.4 13.6 2 9.5 2C5.4 2 2 5.4 2 9.5C2 13.6 5.3 17 9.5 17C11.2 17 12.7 16.4 14 15.5L20 21.5L21 20.5ZM3.5 9.5C3.5 6.2 6.2 3.5 9.5 3.5C12.8 3.5 15.5 6.2 15.5 9.5C15.5 12.8 12.8 15.5 9.5 15.5C6.2 15.5 3.5 12.8 3.5 9.5Z"/>
  </g>
  <text class="t" x="174" y="184">名前を住所に変える</text>
  <text class="s" x="174" y="204">DNS が電話帳の役をする</text>
  <text class="val" x="174" y="228">example.com → 93.184.216.34</text>
</g>

<line class="arrow" x1="322" y1="177" x2="356" y2="177" marker-end="url(#dnArrow)"/>

<!-- step 2 -->
<g>
  <rect class="box" x="364" y="112" width="272" height="130" rx="10"/>
  <circle class="num-bg" cx="382" cy="130" r="11"/><text class="num" x="382" y="134">2</text>
  <g transform="translate(486,132) scale(0.95)">
    <path class="icon" fill-rule="evenodd" clip-rule="evenodd" d="M4.79844 7.7L6.99844 10L5.99844 11L1.89844 7L5.99844 3L6.99844 4L4.79844 6.2H20.9984V7.7H4.79844ZM17 13L18 12L22.1 16L18 20L17 19L19.2 16.7H3V15.2H19.2L17 13Z"/>
  </g>
  <text class="t" x="500" y="184">窓口につなぐ</text>
  <text class="s" x="500" y="204">ポート番号で窓口を指定する</text>
  <text class="val" x="500" y="228">93.184.216.34 : 443</text>
</g>

<line class="arrow" x1="644" y1="177" x2="678" y2="177" marker-end="url(#dnArrow)"/>

<!-- step 3 -->
<g>
  <rect class="box" x="686" y="112" width="280" height="130" rx="10"/>
  <circle class="num-bg" cx="704" cy="130" r="11"/><text class="num" x="704" y="134">3</text>
  <g transform="translate(812,132) scale(0.95)">
    <path class="icon" d="M21 16.4999V4.8999H3V16.4999H10.5V19.4999H7.5V20.9999H16.5V19.4999H13.5V16.4999H21ZM4.5 6.3999H19.5V14.9999H4.5V6.3999Z"/>
  </g>
  <text class="t" x="826" y="184">やっと会話が始まる</text>
  <text class="s" x="826" y="204">ここからが HTTP の出番</text>
  <text class="val" x="826" y="228">GET /about</text>
</g>

<!-- failure hints -->
<line class="rule" x1="34" y1="264" x2="966" y2="264"/>
<text class="fail" x="174" y="290">ここで止まると</text>
<text class="fail" x="174" y="308">「名前が引けない」</text>
<text class="fail" x="500" y="290">ここで止まると</text>
<text class="fail" x="500" y="308">「つながらない・応答がない」</text>
<text class="fail" x="826" y="290">ここで止まると</text>
<text class="fail" x="826" y="308">「エラー番号が返ってくる」</text>

<text class="foot" x="500" y="344">「繋がらない」と言われたら、この3段階のどこで止まっているかをまず切り分けます。症状が違うので区別できます。</text>

</svg>
