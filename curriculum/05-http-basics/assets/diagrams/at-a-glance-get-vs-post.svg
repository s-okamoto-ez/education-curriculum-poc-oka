<svg viewBox="0 0 720 190" role="img" aria-label="今日やること: httpbin.orgにGETとPOSTを送り比べ、レスポンスに含まれるargsとformという項目のどちらに値が入るかを見比べて、メソッドが伝えている意味の違いを確認する。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .num-bg-1 { fill: #1f6f66; }
  .num-bg-2 { fill: #a8792f; }
  .num { fill: #ffffff; font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 9.5px; text-anchor: start; }
  .cmd { fill: #e7ece9; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; }
  .dim { fill: #6b746d; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; }
  .hit-a { fill: #7fe0d2; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; font-weight: 700; text-anchor: start; }
  .hit-b { fill: #e0bc7c; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; font-weight: 700; text-anchor: start; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
  .s { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .t { fill: #e7ece9; }
    .s { fill: #a9b3ac; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="190"/>

<circle class="num-bg-1" cx="200" cy="24" r="12"/><text class="num" x="200" y="29">1</text>
<text class="t" x="200" y="48">GETで送る</text>
<rect class="win" x="40" y="58" width="320" height="90" rx="6"/>
<text class="win-title" x="50" y="72">ターミナル</text>
<text class="cmd" x="50" y="90">$ curl https://httpbin.org/get</text>
<text class="dim" x="50" y="108">"args": {}</text>
<text class="hit-a" x="50" y="126">"form": {} ← 空のまま</text>

<circle class="num-bg-2" cx="520" cy="24" r="12"/><text class="num" x="520" y="29">2</text>
<text class="t" x="520" y="48">POSTで送る</text>
<rect class="win" x="360" y="58" width="320" height="90" rx="6"/>
<text class="win-title" x="370" y="72">ターミナル</text>
<text class="cmd" x="370" y="90">$ curl -X POST .../post -d "message=hello"</text>
<text class="dim" x="370" y="108">"args": {}</text>
<text class="hit-b" x="370" y="126">"form": {"message": "hello"}</text>

<text class="s" x="360" y="172">送ったデータが "form" に入るかどうかで、メソッドの違いが目に見える</text>
</svg>
