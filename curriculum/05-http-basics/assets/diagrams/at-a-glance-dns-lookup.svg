<svg viewBox="0 0 720 170" role="img" aria-label="今日やること: curl -v https://example.com を実行し、出力の中のTryingという行に注目すると、example.comが93.184.216.34という数字の並び(IPアドレス)に変換されてから通信していることが分かる。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .num-bg-1 { fill: #1f6f66; }
  .num-bg-2 { fill: #a8792f; }
  .num { fill: #ffffff; font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 9.5px; text-anchor: start; }
  .cmd { fill: #e7ece9; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; text-anchor: start; }
  .dim { fill: #6b746d; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; text-anchor: start; }
  .hit { fill: #e0bc7c; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10.5px; font-weight: 700; text-anchor: start; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
  .arrow { stroke: #8d968f; stroke-width: 2; fill: none; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .t { fill: #e7ece9; }
    .arrow { stroke: #6b746d; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="170"/>
<defs>
  <marker id="agD1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <polygon points="0,0 10,5 0,10" fill="#8d968f"/>
  </marker>
</defs>

<circle class="num-bg-1" cx="130" cy="24" r="12"/><text class="num" x="130" y="29">1</text>
<text class="t" x="130" y="48">名前のまま実行する</text>
<rect class="win" x="20" y="58" width="220" height="80" rx="6"/>
<text class="win-title" x="30" y="72">ターミナル</text>
<text class="cmd" x="30" y="92">$ curl -v https://example.com</text>
<text class="dim" x="30" y="112">* Trying ...</text>
<text class="dim" x="30" y="128">(まだ何も分からない)</text>

<line class="arrow" x1="248" y1="98" x2="292" y2="98" marker-end="url(#agD1)"/>

<circle class="num-bg-2" cx="420" cy="24" r="12"/><text class="num" x="420" y="29">2</text>
<text class="t" x="420" y="48">Trying行に注目する</text>
<rect class="win" x="300" y="58" width="400" height="80" rx="6"/>
<text class="win-title" x="310" y="72">ターミナル(-vの出力)</text>
<text class="dim" x="310" y="92">* Trying <tspan class="hit">93.184.216.34</tspan>:443...</text>
<text class="dim" x="310" y="112">* Connected to example.com</text>
<text class="hit" x="310" y="128">↑ これが example.com の正体(IPアドレス)</text>

<text class="t" x="360" y="160" style="font-size:11.5px;font-weight:400;fill:#6b746d">名前のまま送っているように見えて、裏では数字の住所に変換されている</text>
</svg>
