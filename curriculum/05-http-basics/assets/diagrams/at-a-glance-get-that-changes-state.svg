<svg viewBox="0 0 720 200" role="img" aria-label="今日やること: いいねAPIがGETで実装されているため、curlでただ呼び出すだけでlikesが増え続けてしまう。ブラウザの先読みやクローラーが黙って踏む危険を確認し、GETからPOSTに変えて直す。" xmlns="http://www.w3.org/2000/svg">
<style>
  .bg { fill: #eef1ef; }
  .num-bg-1 { fill: #a35555; }
  .num-bg-2 { fill: #1f6f66; }
  .num { fill: #ffffff; font-family: ui-monospace, Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
  .win { fill: #1a1f1d; stroke: #2b3230; stroke-width: 1.2; }
  .win-title { fill: #a9b3ac; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 9.5px; text-anchor: start; }
  .cmd { fill: #e7ece9; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 10px; text-anchor: start; }
  .ng { fill: #e29a9a; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; font-weight: 700; text-anchor: start; }
  .ok { fill: #86d6cb; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; font-weight: 700; text-anchor: start; }
  .t { fill: #15191a; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 12.5px; font-weight: 700; text-anchor: middle; }
  .s { fill: #465049; font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; font-size: 11.5px; text-anchor: middle; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #121615; }
    .t { fill: #e7ece9; }
    .s { fill: #a9b3ac; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="200"/>

<circle class="num-bg-1" cx="200" cy="24" r="12"/><text class="num" x="200" y="29">1</text>
<text class="t" x="200" y="48">GETのまま呼び続ける</text>
<rect class="win" x="40" y="58" width="320" height="100" rx="6"/>
<text class="win-title" x="50" y="72">ターミナル</text>
<text class="cmd" x="50" y="90">$ curl .../p001/like</text>
<text class="ng" x="50" y="105">likes: 13</text>
<text class="cmd" x="50" y="124">$ curl .../p001/like</text>
<text class="ng" x="50" y="139">likes: 14</text>

<circle class="num-bg-2" cx="520" cy="24" r="12"/><text class="num" x="520" y="29">2</text>
<text class="t" x="520" y="48">POSTに直したあと</text>
<rect class="win" x="360" y="58" width="320" height="100" rx="6"/>
<text class="win-title" x="370" y="72">ターミナル</text>
<text class="cmd" x="370" y="90">$ curl -X POST .../like</text>
<text class="ok" x="370" y="105">likes: 15</text>
<text class="cmd" x="370" y="124">$ curl .../p001/like (GET)</text>
<text class="ok" x="370" y="139">404 Not Found</text>

<text class="s" x="360" y="182">GETは「何度呼んでも状態を変えない」が約束。POSTに直すとGETでは動かなくなり安全になる</text>
</svg>
